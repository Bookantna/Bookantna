name: Refresh activity

on:
  schedule:
    - cron: "17 1 * * *" # 08:17 Asia/Bangkok
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - run: python scripts/fetch_activity.py
        env:
          # Add a PROFILE_PAT secret (read:user) to also count private contributions.
          GITHUB_TOKEN: ${{ secrets.PROFILE_PAT || secrets.GITHUB_TOKEN }}
      - run: python scripts/build.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/activity.json assets/
          git diff --cached --quiet || { git commit -m "chore: refresh activity"; git push; }
