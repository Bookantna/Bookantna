<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
<title id="t">Character sheet: powers and gadgets</title>
<desc id="d">A trading card for Bookantna. Class: data engineer in training. Home base: Khon Kaen, Thailand. Alignment: chaotic good. Special move: paired bootstrap, ten thousand hits. Weakness: leaky train and test splits. Powers and gadgets. Languages: Python, SQL, C/C++, Java. Machine learning: PyTorch, TensorFlow, scikit-learn, LightGBM. Data: Pandas, NumPy, Jupyter, LangChain, FastAPI. Tools: Git, Docker, Spring Boot, Swift, VS Code. Databases: PostgreSQL, MySQL, SQLite, Oracle.</desc>
<style>
/*FONTS*/
.b{font-family:'Bangers',Impact,sans-serif}
.c{font-family:'Comic Neue','Comic Sans MS',cursive;font-weight:700}
.m{font-family:'Geist Mono',ui-monospace,monospace}
.p{transform-box:fill-box;transform-origin:center;animation:p .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes p{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.card{transform-origin:218px 262px;animation:card 5s ease-in-out infinite}
@keyframes card{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(-1deg) translateY(-4px)}}
.foil{animation:foil 4s cubic-bezier(.65,0,.35,1) 1s infinite both}
@keyframes foil{0%{transform:translateX(-120px)}45%,100%{transform:translateX(520px)}}
.rays{transform-origin:218px 186px;animation:rays 40s linear infinite}
@keyframes rays{to{transform:rotate(360deg)}}
.glint{animation:glint 3.8s cubic-bezier(.65,0,.35,1) 1.6s infinite both}
@keyframes glint{0%{transform:translateX(0)}35%,100%{transform:translateX(130px)}}
.pow{transform-origin:1112px 82px;animation:pow 1.8s cubic-bezier(.34,1.56,.64,1) infinite}
@keyframes pow{0%,100%{transform:rotate(8deg) scale(1)}12%{transform:rotate(4deg) scale(1.14)}30%{transform:rotate(8deg) scale(1)}}
.cur{animation:cur 1s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.foil{display:none}}
</style>
<defs>
  <pattern id="htk" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="3.5" cy="3.5" r="1.5" fill="#1d1a16"/></pattern>
  <pattern id="htr" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="4" cy="4" r="2.3" fill="#e4432d"/></pattern>
  <pattern id="hty" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="4.5" cy="4.5" r="2.4" fill="#f7c548"/></pattern>
  <clipPath id="lenses"><circle cx="904" cy="404" r="21"/><circle cx="956" cy="404" r="21"/></clipPath>
  <clipPath id="portrait"><rect x="52" y="94" width="332" height="170"/></clipPath>
  <clipPath id="cardclip"><rect x="30" y="72" width="376" height="380" rx="14"/></clipPath>
</defs>
