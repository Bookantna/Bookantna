<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="412" viewBox="0 0 1200 412" role="img" aria-labelledby="t d">
<title id="t">Stack, as a partition table</title>
<desc id="d">Languages: Python, SQL, C/C++, Java. ML: PyTorch, TensorFlow, scikit-learn, LightGBM. Data: Pandas, NumPy, Jupyter, LangChain. Tools: Git, Docker, Spring Boot, Swift, VS Code. Databases: PostgreSQL, MySQL, SQLite, Oracle.</desc>
<style>
/*FONTS*/
.s{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}
.m{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.seg{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.3s cubic-bezier(.16,1,.3,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.fade{animation:fade .8s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rise{animation:rise 1s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.head{animation:sweep 8s cubic-bezier(.65,0,.35,1) 1.8s infinite alternate both}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(1102px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.head{display:none}}
</style>
<defs>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="6" height="6" fill="#2a2926"/><rect width="1.4" height="6" fill="#4a4740"/>
  </pattern>
  <clipPath id="bar"><rect x="48" y="132" width="1104" height="48" rx="8"/></clipPath>
</defs>
<rect width="1200" height="412" rx="22" fill="#121211"/>
<rect x=".5" y=".5" width="1199" height="411" rx="21.5" fill="none" stroke="#2a2926"/>

<g class="m" font-size="11" letter-spacing="1.4">
  <text x="48" y="62" fill="#e2a03f">02<tspan fill="#6f6c65">  /  STACK</tspan></text>
  <text x="1138" y="62" text-anchor="end" fill="#6f6c65">$ lsblk /dev/thanawat</text>
</g>
<rect class="cur" x="1144" y="52" width="8" height="13" fill="#e2a03f"/>
<text class="s" x="47" y="102" font-size="30" font-weight="600" letter-spacing="-1" fill="#e9e6df">Partition table</text>
<text class="m" x="1152" y="100" text-anchor="end" font-size="11" letter-spacing="1.2" fill="#6f6c65">5 PARTITIONS  ·  100.0G  ·  GPT</text>

<g clip-path="url(#bar)">
  <rect x="48" y="132" width="1104" height="48" fill="#0b0b0a"/>
  <rect class="seg" style="animation-delay:.2s" x="48" y="132" width="417.8" height="48" fill="#e2a03f"/>
  <rect class="seg" style="animation-delay:.32s" x="469.8" y="132" width="294.8" height="48" fill="#4a4740"/>
  <rect class="seg" style="animation-delay:.44s" x="768.6" y="132" width="182.8" height="48" fill="#36342f"/>
  <rect class="seg" style="animation-delay:.56s" x="955.4" y="132" width="121.9" height="48" fill="url(#hatch)"/>
  <rect class="seg" style="animation-delay:.68s" x="1081.3" y="132" width="70.7" height="48" fill="#22211e"/>
  <rect class="head" x="47" y="128" width="2" height="56" fill="#ece7dc" opacity=".85"/>
</g>
<g class="m fade" style="animation-delay:.9s" font-size="11" letter-spacing=".6">
  <text x="62" y="152" fill="#5a3f14">sda1</text><text x="62" y="170" fill="#1d1c1a" font-weight="500">/languages  38.4G</text>
  <text x="483.8" y="152" fill="#8a877f">sda2</text><text x="483.8" y="170" fill="#e9e6df">/ml  27.1G</text>
  <text x="782.6" y="152" fill="#8a877f">sda3</text><text x="782.6" y="170" fill="#e9e6df">/data  16.8G</text>
  <text x="969.4" y="152" fill="#8a877f">sda4</text><text x="969.4" y="170" fill="#e9e6df">11.2G</text>
  <text x="1093.3" y="152" fill="#8a877f">sda5</text><text x="1093.3" y="170" fill="#e9e6df">6.5G</text>
</g>

<g class="m" font-size="10" letter-spacing="1.4" fill="#5a5852">
  <text x="68" y="226">DEVICE</text><text x="148" y="226">MOUNT</text><text x="330" y="226" text-anchor="end">SIZE</text><text x="380" y="226">CONTENTS</text>
</g>
<g stroke="#232321"><path d="M48 236H1152M48 266H1152M48 296H1152M48 326H1152M48 356H1152"/></g>

<g font-size="14.5">
  <g class="rise" style="animation-delay:.8s">
    <rect x="48" y="246" width="10" height="10" rx="2" fill="#e2a03f"/>
    <text class="m" x="68" y="255" font-size="12" fill="#8a877f">sda1</text><text class="m" x="148" y="255" font-size="12" fill="#e9e6df">/languages</text><text class="m" x="330" y="255" font-size="12" text-anchor="end" fill="#e9e6df">38.4G</text>
    <text class="s" x="380" y="256" fill="#c9c5bc">Python<tspan fill="#5a5852">  ·  </tspan>SQL<tspan fill="#5a5852">  ·  </tspan>C/C++<tspan fill="#5a5852">  ·  </tspan>Java</text>
  </g>
  <g class="rise" style="animation-delay:.88s">
    <rect x="48" y="276" width="10" height="10" rx="2" fill="#4a4740"/>
    <text class="m" x="68" y="285" font-size="12" fill="#8a877f">sda2</text><text class="m" x="148" y="285" font-size="12" fill="#e9e6df">/ml</text><text class="m" x="330" y="285" font-size="12" text-anchor="end" fill="#e9e6df">27.1G</text>
    <text class="s" x="380" y="286" fill="#c9c5bc">PyTorch<tspan fill="#5a5852">  ·  </tspan>TensorFlow<tspan fill="#5a5852">  ·  </tspan>scikit-learn<tspan fill="#5a5852">  ·  </tspan>LightGBM</text>
  </g>
  <g class="rise" style="animation-delay:.96s">
    <rect x="48" y="306" width="10" height="10" rx="2" fill="#36342f" stroke="#4a4740" stroke-width=".6"/>
    <text class="m" x="68" y="315" font-size="12" fill="#8a877f">sda3</text><text class="m" x="148" y="315" font-size="12" fill="#e9e6df">/data</text><text class="m" x="330" y="315" font-size="12" text-anchor="end" fill="#e9e6df">16.8G</text>
    <text class="s" x="380" y="316" fill="#c9c5bc">Pandas<tspan fill="#5a5852">  ·  </tspan>NumPy<tspan fill="#5a5852">  ·  </tspan>Jupyter<tspan fill="#5a5852">  ·  </tspan>LangChain<tspan fill="#5a5852">  ·  </tspan>FastAPI</text>
  </g>
  <g class="rise" style="animation-delay:1.04s">
    <rect x="48" y="336" width="10" height="10" rx="2" fill="url(#hatch)"/>
    <text class="m" x="68" y="345" font-size="12" fill="#8a877f">sda4</text><text class="m" x="148" y="345" font-size="12" fill="#e9e6df">/tools</text><text class="m" x="330" y="345" font-size="12" text-anchor="end" fill="#e9e6df">11.2G</text>
    <text class="s" x="380" y="346" fill="#c9c5bc">Git<tspan fill="#5a5852">  ·  </tspan>Docker<tspan fill="#5a5852">  ·  </tspan>Spring Boot<tspan fill="#5a5852">  ·  </tspan>Swift<tspan fill="#5a5852">  ·  </tspan>VS Code</text>
  </g>
  <g class="rise" style="animation-delay:1.12s">
    <rect x="48" y="366" width="10" height="10" rx="2" fill="#22211e" stroke="#4a4740" stroke-width=".6"/>
    <text class="m" x="68" y="375" font-size="12" fill="#8a877f">sda5</text><text class="m" x="148" y="375" font-size="12" fill="#e9e6df">/db</text><text class="m" x="330" y="375" font-size="12" text-anchor="end" fill="#e9e6df">6.5G</text>
    <text class="s" x="380" y="376" fill="#c9c5bc">PostgreSQL<tspan fill="#5a5852">  ·  </tspan>MySQL<tspan fill="#5a5852">  ·  </tspan>SQLite<tspan fill="#5a5852">  ·  </tspan>Oracle</text>
  </g>
</g>
</svg>
