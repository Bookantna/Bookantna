<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-labelledby="t">
<title id="t">Collected adventures. Click an episode to open the repo.</title>
<style>
/*FONTS*/
.b{font-family:'Bangers',Impact,sans-serif}
.c{font-family:'Comic Neue','Comic Sans MS',cursive;font-weight:700}
.m{font-family:'Geist Mono',ui-monospace,monospace}
.nudge{animation:nudge 1.2s cubic-bezier(.65,0,.35,1) infinite}
@keyframes nudge{50%{transform:translateY(5px)}}
.rays{transform-origin:600px 55px;animation:slide 6s linear infinite}
@keyframes slide{to{transform:translateX(-40px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <pattern id="stripe" width="40" height="110" patternUnits="userSpaceOnUse" patternTransform="skewX(-30)">
    <rect width="20" height="110" fill="#e4432d"/>
  </pattern>
  <clipPath id="band"><rect x="3" y="3" width="1194" height="104" rx="6"/></clipPath>
</defs>
<g clip-path="url(#band)">
  <rect width="1200" height="110" fill="#f7c548"/>
  <g class="rays"><rect x="0" width="1260" height="110" fill="url(#stripe)" opacity=".18"/></g>
</g>
<rect x="3" y="3" width="1194" height="104" rx="6" fill="none" stroke="#1d1a16" stroke-width="6"/>
<rect x="28" y="24" width="150" height="34" fill="#1d1a16"/>
<text class="m" x="42" y="46" font-size="12" font-weight="700" letter-spacing="2" fill="#f7c548">PAGE 4 ONWARD</text>
<text class="b" x="196" y="80" font-size="60" letter-spacing="2" fill="#fffaf0" stroke="#1d1a16" stroke-width="7" stroke-linejoin="round" paint-order="stroke">COLLECTED ADVENTURES</text>
<text class="c" x="1110" y="62" text-anchor="end" font-size="17" fill="#1d1a16">Click an episode to read the repo</text>
<g class="nudge" fill="none" stroke="#1d1a16" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M1146 38V70M1134 58L1146 70L1158 58"/>
</g>
</svg>
