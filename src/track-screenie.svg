<svg xmlns="http://www.w3.org/2000/svg" width="708" height="320" viewBox="0 0 708 320" role="img" aria-labelledby="t d">
<title id="t">Episode 02: Screenie</title>
<desc id="d">Screenie: a menu-bar screenshot tool for macOS 14+, written in Swift 6. Area, window and timed capture, annotation, OCR via Apple Vision, and a pixel ruler. 20-capture history, 6 annotation tools, no Dock icon. Art: a marching-ants selection on a tiny desktop, and a camera flash: snap!</desc>
<style>
/*FONTS*/
.b{font-family:'Bangers',Impact,sans-serif}
.c{font-family:'Comic Neue','Comic Sans MS',cursive;font-weight:700}
.r{font-weight:400}
.m{font-family:'Geist Mono',ui-monospace,monospace}
.in{animation:in .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ants{animation:ants .8s linear infinite}
@keyframes ants{to{stroke-dashoffset:-16}}
.flash{animation:flash 3.6s steps(1) infinite}
@keyframes flash{0%,62%{opacity:0}63%,66%{opacity:.9}67%,100%{opacity:0}}
.snap{transform-origin:618px 76px;animation:snap 3.6s cubic-bezier(.34,1.56,.64,1) infinite both}
@keyframes snap{0%,62%{opacity:0;transform:scale(.2) rotate(-10deg)}70%,92%{opacity:1;transform:rotate(8deg)}100%{opacity:0;transform:rotate(8deg)}}
.tag{animation:tag 3.6s cubic-bezier(.34,1.56,.64,1) infinite both}
@keyframes tag{0%,10%{opacity:0;transform:translateY(5px)}20%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.flash{opacity:0}}
</style>
<defs><clipPath id="scr"><rect x="384" y="26" width="298" height="268"/></clipPath></defs>
<rect width="708" height="320" rx="6" fill="#fffaf0"/>
<rect x="3" y="3" width="702" height="314" rx="6" fill="none" stroke="#1d1a16" stroke-width="6"/>

<rect x="26" y="26" width="138" height="30" fill="#1d1a16"/>
<text class="m" x="40" y="46" font-size="12" font-weight="700" letter-spacing="2" fill="#f7c548">EPISODE 02</text>
<text class="m" x="176" y="46" font-size="10.5" font-weight="600" letter-spacing="1.4" fill="#1d1a16" opacity=".6">SWIFT 6 / MACOS</text>
<g class="in">
  <text class="b" x="24" y="114" font-size="60" letter-spacing="2" fill="#f7c548" stroke="#1d1a16" stroke-width="6" stroke-linejoin="round" paint-order="stroke">SCREENIE</text>
  <text class="c" x="26" y="142" font-size="16" fill="#e4432d">IN: SNAP HAPPY</text>
</g>
<g class="c r in" style="animation-delay:.12s" font-size="15.5" fill="#1d1a16">
  <text x="26" y="174">Menu-bar screenshot tool. Area,</text>
  <text x="26" y="196">window and timed capture, notes,</text>
  <text x="26" y="218">OCR via Apple Vision, pixel ruler.</text>
</g>
<g class="in" style="animation-delay:.3s">
  <g stroke="#1d1a16" stroke-width="3.5">
    <rect x="26" y="242" width="100" height="52" fill="#f7c548"/>
    <rect x="134" y="242" width="112" height="52" fill="#fffaf0"/>
    <rect x="254" y="242" width="108" height="52" fill="#1d1a16"/>
  </g>
  <g class="b" font-size="30"><text x="38" y="278" fill="#1d1a16">20</text><text x="146" y="278" fill="#e4432d">6</text><text x="266" y="278" fill="#f7c548">0</text></g>
  <g class="m" font-size="8.5" font-weight="700" letter-spacing="1" text-anchor="end">
    <text x="120" y="272" fill="#1d1a16">HISTORY</text><text x="240" y="272" fill="#1d1a16">ANNOTATORS</text>
    <text x="356" y="264" fill="#fffaf0">DOCK</text><text x="356" y="276" fill="#fffaf0">ICONS</text>
  </g>
</g>

<!-- mini desktop -->
<g clip-path="url(#scr)">
  <rect x="384" y="26" width="298" height="268" fill="#f4ecd6"/>
  <rect x="384" y="26" width="298" height="22" fill="#1d1a16"/>
  <g fill="#fffaf0" opacity=".6"><rect x="396" y="34" width="10" height="7" rx="2"/><rect x="414" y="35" width="26" height="5" rx="2.5"/><rect x="446" y="35" width="18" height="5" rx="2.5"/></g>
  <rect x="628" y="31" width="13" height="12" rx="2" fill="none" stroke="#f7c548" stroke-width="2" stroke-dasharray="3 2"/>
  <text class="m" x="672" y="41" text-anchor="end" font-size="9" font-weight="600" fill="#fffaf0">9:41</text>
  <rect x="402" y="66" width="168" height="124" rx="6" fill="#fffaf0" stroke="#1d1a16" stroke-width="3.5"/>
  <g fill="#1d1a16"><circle cx="414" cy="78" r="3"/><circle cx="424" cy="78" r="3"/><circle cx="434" cy="78" r="3"/></g>
  <g fill="#1d1a16" opacity=".25"><rect x="414" y="94" width="100" height="6" rx="3"/><rect x="414" y="108" width="136" height="6" rx="3"/><rect x="414" y="122" width="80" height="6" rx="3"/></g>
  <rect x="414" y="138" width="144" height="40" rx="4" fill="#f7c548" stroke="#1d1a16" stroke-width="2.5"/>
  <rect x="520" y="140" width="146" height="128" rx="6" fill="#fffaf0" stroke="#1d1a16" stroke-width="3.5"/>
  <g fill="#1d1a16"><circle cx="532" cy="152" r="3"/><circle cx="542" cy="152" r="3"/><circle cx="552" cy="152" r="3"/></g>
  <circle cx="593" cy="212" r="30" fill="#e4432d" stroke="#1d1a16" stroke-width="3"/>
  <path d="M440 96V206H620V96Z" fill="none"/>
  <path fill="#1d1a16" fill-opacity=".5" fill-rule="evenodd" d="M384 48H682V294H384ZM444 96V208H616V96Z"/>
  <rect class="ants" x="444" y="96" width="172" height="112" fill="none" stroke="#fffaf0" stroke-width="2.5" stroke-dasharray="6 4"/>
  <g fill="#fffaf0" stroke="#1d1a16" stroke-width="2">
    <rect x="440" y="92" width="8" height="8" rx="1"/><rect x="612" y="92" width="8" height="8" rx="1"/>
    <rect x="440" y="204" width="8" height="8" rx="1"/><rect x="612" y="204" width="8" height="8" rx="1"/>
  </g>
  <g class="tag">
    <rect x="534" y="218" width="82" height="22" rx="4" fill="#f7c548" stroke="#1d1a16" stroke-width="2.5"/>
    <text class="m" x="575" y="233.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d1a16">344 × 224</text>
  </g>
  <rect class="flash" x="384" y="26" width="298" height="268" fill="#fffaf0"/>
</g>
<g class="snap">
  <path d="{{BURST 618 76 34 58 10 41}}" fill="#f7c548" stroke="#1d1a16" stroke-width="4.5" stroke-linejoin="round"/>
  <text class="b" x="618" y="88" text-anchor="middle" font-size="32" letter-spacing="1" fill="#e4432d" stroke="#1d1a16" stroke-width="3.5" paint-order="stroke">SNAP!</text>
</g>
<rect x="384" y="26" width="298" height="268" fill="none" stroke="#1d1a16" stroke-width="5"/>
</svg>
