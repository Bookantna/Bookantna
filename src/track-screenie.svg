<svg xmlns="http://www.w3.org/2000/svg" width="708" height="300" viewBox="0 0 708 300" role="img" aria-labelledby="t d">
<title id="t">Screenie</title>
<desc id="d">Screenie: a menu-bar screenshot tool for macOS 14+, written in Swift 6. Area, window and timed capture, annotation, OCR via Apple Vision, and a pixel ruler. 20-capture history, 6 annotation tools, no Dock icon.</desc>
<style>
/*FONTS*/
.s{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}
.m{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.rise{animation:rise 1s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ants{animation:ants .9s linear infinite}
@keyframes ants{to{stroke-dashoffset:-16}}
.tag{animation:tag 4s cubic-bezier(.16,1,.3,1) infinite both}
@keyframes tag{0%,8%{opacity:0;transform:translateY(4px)}18%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <clipPath id="scr"><rect x="392" y="36" width="276" height="228" rx="10"/></clipPath>
</defs>
<rect width="708" height="300" rx="20" fill="#121211"/>
<rect x=".5" y=".5" width="707" height="299" rx="19.5" fill="none" stroke="#2a2926"/>

<text class="m" x="40" y="54" font-size="11" letter-spacing="1.4" fill="#e2a03f">TRK 02<tspan fill="#6f6c65">  /  SWIFT 6  ·  MACOS 14+</tspan></text>
<text class="s rise" x="38" y="104" font-size="34" font-weight="620" letter-spacing="-1.3" fill="#e9e6df">Screenie</text>
<g class="s rise" style="animation-delay:.1s" font-size="15" fill="#bdb9b0">
  <text x="40" y="140">Menu-bar screenshot tool. Area, window</text>
  <text x="40" y="162">and timed capture, annotation, OCR via</text>
  <text x="40" y="184">Apple Vision, and a pixel ruler.</text>
</g>
<g class="rise" style="animation-delay:.25s">
  <g class="m" font-size="22" fill="#e9e6df"><text x="40" y="244">20</text><text x="134" y="244">6</text><text x="252" y="244">0</text></g>
  <g class="m" font-size="9.5" letter-spacing="1.2" fill="#6f6c65"><text x="40" y="264">HISTORY</text><text x="134" y="264">ANNOTATORS</text><text x="252" y="264">DOCK ICONS</text></g>
</g>

<!-- mini desktop -->
<g clip-path="url(#scr)">
  <rect x="392" y="36" width="276" height="228" fill="#0c0c0b"/>
  <rect x="392" y="36" width="276" height="18" fill="#1a1918"/>
  <g fill="#4a4843"><rect x="404" y="42" width="8" height="6" rx="1.5"/><rect x="420" y="43" width="22" height="4" rx="2"/><rect x="448" y="43" width="16" height="4" rx="2"/><rect x="470" y="43" width="18" height="4" rx="2"/></g>
  <g fill="#4a4843"><rect x="586" y="42" width="12" height="6" rx="1.5"/><rect x="606" y="42" width="10" height="6" rx="1.5"/></g>
  <rect x="626" y="40" width="10" height="10" rx="2" fill="none" stroke="#e2a03f" stroke-dasharray="2 1.5"/>
  <text class="m" x="660" y="48.5" text-anchor="end" font-size="8" fill="#6f6c65">9:41</text>
  <!-- windows -->
  <rect x="408" y="70" width="156" height="118" rx="6" fill="#1a1918" stroke="#2a2926"/>
  <g fill="#3b3a36"><circle cx="418" cy="80" r="2.5"/><circle cx="426" cy="80" r="2.5"/><circle cx="434" cy="80" r="2.5"/></g>
  <g fill="#2a2926"><rect x="418" y="96" width="96" height="5" rx="2.5"/><rect x="418" y="108" width="128" height="5" rx="2.5"/><rect x="418" y="120" width="72" height="5" rx="2.5"/><rect x="418" y="140" width="136" height="38" rx="4"/></g>
  <rect x="520" y="132" width="132" height="116" rx="6" fill="#161615" stroke="#2a2926"/>
  <g fill="#3b3a36"><circle cx="530" cy="142" r="2.5"/><circle cx="538" cy="142" r="2.5"/><circle cx="546" cy="142" r="2.5"/></g>
  <g fill="#2a2926"><rect x="530" y="158" width="64" height="5" rx="2.5"/><rect x="530" y="170" width="104" height="5" rx="2.5"/><rect x="530" y="182" width="84" height="5" rx="2.5"/></g>
  <!-- dim everything outside the selection -->
  <path fill="#050505" fill-opacity=".55" fill-rule="evenodd" d="M392 54H668V264H392ZM450 98V202H614V98Z"/>
  <rect x="450" y="98" width="164" height="104" fill="none" stroke="#121211" stroke-width="1.2"/>
  <rect class="ants" x="450" y="98" width="164" height="104" fill="none" stroke="#ece7dc" stroke-width="1.2" stroke-dasharray="5 3"/>
  <g fill="#ece7dc" stroke="#121211" stroke-width=".8">
    <rect x="447" y="95" width="6" height="6" rx="1"/><rect x="611" y="95" width="6" height="6" rx="1"/>
    <rect x="447" y="199" width="6" height="6" rx="1"/><rect x="611" y="199" width="6" height="6" rx="1"/>
  </g>
  <g class="tag">
    <rect x="540" y="210" width="74" height="18" rx="4" fill="#e2a03f"/>
    <text class="m" x="577" y="222.5" text-anchor="middle" font-size="9.5" font-weight="500" fill="#1d1c1a">328 × 208</text>
  </g>
</g>
<rect x="392.5" y="36.5" width="275" height="227" rx="9.5" fill="none" stroke="#2a2926"/>
</svg>
