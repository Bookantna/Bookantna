<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
<title id="t">Episode 04: Multiprocessing</title>
<desc id="d">Multiprocessing, in: attack of the clones. A study of sequential versus parallel image filtering in Python, across Gaussian blur, box blur and edge detection. Art: one sequential progress bar crawls while four parallel workers race to done.</desc>
<style>
/*FONTS*/
.b{font-family:'Bangers',Impact,sans-serif}
.c{font-family:'Comic Neue','Comic Sans MS',cursive;font-weight:700}
.r{font-weight:400}
.m{font-family:'Geist Mono',ui-monospace,monospace}
.in{animation:in .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.seq{transform-box:fill-box;transform-origin:0 50%;animation:seq 6s linear infinite}
@keyframes seq{0%{transform:scaleX(0)}85%,100%{transform:scaleX(1)}}
.par{transform-box:fill-box;transform-origin:0 50%;animation:par 6s cubic-bezier(.5,0,.3,1) infinite}
@keyframes par{0%{transform:scaleX(0)}24%,100%{transform:scaleX(1)}}
.done{transform-box:fill-box;transform-origin:center;animation:done 6s cubic-bezier(.34,1.56,.64,1) infinite both}
@keyframes done{0%,24%{opacity:0;transform:scale(.2) rotate(-10deg)}30%,96%{opacity:1;transform:rotate(-6deg)}100%{opacity:0}}
.whoosh{transform-origin:400px 66px;animation:whoosh 1s ease-in-out infinite alternate}
@keyframes whoosh{from{transform:translateX(-4px) skewX(-8deg)}to{transform:translateX(4px) skewX(-14deg)}}
.lines{animation:lines .6s linear infinite}
@keyframes lines{to{transform:translateX(-24px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="480" height="320" rx="6" fill="#fffaf0"/>
<rect x="3" y="3" width="474" height="314" rx="6" fill="none" stroke="#1d1a16" stroke-width="6"/>

<rect x="24" y="26" width="138" height="30" fill="#1d1a16"/>
<text class="m" x="38" y="46" font-size="12" font-weight="700" letter-spacing="2" fill="#f7c548">EPISODE 04</text>
<g class="whoosh">
  <text class="b" x="400" y="76" text-anchor="middle" font-size="34" letter-spacing="1.5" fill="#e4432d" stroke="#1d1a16" stroke-width="5" stroke-linejoin="round" paint-order="stroke">WHOOSH!</text>
</g>
<g class="in">
  <text class="b" x="22" y="112" font-size="44" letter-spacing="1.5" fill="#f7c548" stroke="#1d1a16" stroke-width="5.5" stroke-linejoin="round" paint-order="stroke">MULTIPROCESSING</text>
  <text class="c" x="24" y="138" font-size="14.5" fill="#e4432d">IN: ATTACK OF THE CLONES</text>
</g>
<g class="c r in" style="animation-delay:.12s" font-size="14" fill="#1d1a16">
  <text x="24" y="164">Sequential vs. parallel image filtering:</text>
  <text x="24" y="184">Gaussian blur, box blur, edge detection.</text>
</g>

<!-- race -->
<g class="m" font-size="11" font-weight="700" fill="#1d1a16">
  <text x="24" y="218">SEQ</text>
  <text x="24" y="248">P0</text><text x="24" y="264">P1</text><text x="24" y="280">P2</text><text x="24" y="296">P3</text>
</g>
<rect x="64" y="206" width="392" height="16" fill="#f4ecd6" stroke="#1d1a16" stroke-width="3"/>
<rect class="seq" x="64" y="206" width="392" height="16" fill="#1d1a16"/>
<g fill="#f4ecd6" stroke="#1d1a16" stroke-width="2.5">
  <rect x="64" y="238" width="98" height="12"/><rect x="64" y="254" width="98" height="12"/>
  <rect x="64" y="270" width="98" height="12"/><rect x="64" y="286" width="98" height="12"/>
</g>
<g fill="#e4432d">
  <rect class="par" x="64" y="238" width="98" height="12"/>
  <rect class="par" style="animation-delay:.08s" x="64" y="254" width="98" height="12"/>
  <rect class="par" style="animation-delay:.03s" x="64" y="270" width="98" height="12"/>
  <rect class="par" style="animation-delay:.12s" x="64" y="286" width="98" height="12"/>
</g>
<g stroke="#1d1a16" stroke-width="2.5" stroke-linecap="round" opacity=".5">
  <g class="lines"><path d="M176 244H206M190 260H230M180 276H214M196 292H236M224 244H250M246 276H266"/></g>
</g>
<g class="done">
  <rect x="300" y="244" width="132" height="44" fill="#f7c548" stroke="#1d1a16" stroke-width="4"/>
  <text class="b" x="366" y="276" text-anchor="middle" font-size="28" letter-spacing="1.5" fill="#1d1a16">CLONES WIN</text>
</g>
</svg>
