.p0{animation-name:p0}@keyframes p0{0%{transform:scaleX(0);opacity:1}24%,94%{transform:none;opacity:1}100%{transform:none;opacity:0}}
.p1{animation-name:p1}@keyframes p1{0%{transform:scaleX(0);opacity:1}28%,94%{transform:none;opacity:1}100%{transform:none;opacity:0}}
.p2{animation-name:p2}@keyframes p2{0%{transform:scaleX(0);opacity:1}25%,94%{transform:none;opacity:1}100%{transform:none;opacity:0}}
.p3{animation-name:p3}@keyframes p3{0%{transform:scaleX(0);opacity:1}30%,94%{transform:none;opacity:1}100%{transform:none;opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
