<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Multiprocessing</title>
<desc id="d">Multiprocessing: a study of sequential versus parallel image filtering in Python, across Gaussian blur, box blur and edge detection.</desc>
<style>
/*FONTS*/
.s{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}
.m{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.rise{animation:rise 1s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:0 50%;animation:8s cubic-bezier(.45,0,.25,1) infinite both}
.seq{animation-name:seq;animation-timing-function:linear}
