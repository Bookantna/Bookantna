<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t">
<title id="t">The end? Season 2 continues next issue.</title>
<style>
/*FONTS*/
.b{font-family:'Bangers',Impact,sans-serif}
.c{font-family:'Comic Neue','Comic Sans MS',cursive;font-weight:700}
.m{font-family:'Geist Mono',ui-monospace,monospace}
.q{transform-origin:330px 80px;animation:q 1.4s cubic-bezier(.34,1.56,.64,1) infinite}
@keyframes q{0%,70%,100%{transform:none}80%{transform:rotate(14deg) scale(1.2)}}
.hop{animation:hop 1.1s cubic-bezier(.5,0,.5,1) infinite}
@keyframes hop{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="150" rx="6" fill="#fffaf0"/>
<rect x="3" y="3" width="1194" height="144" rx="6" fill="none" stroke="#1d1a16" stroke-width="6"/>
<text class="b" x="30" y="104" font-size="84" letter-spacing="2" fill="#e4432d" stroke="#1d1a16" stroke-width="7" stroke-linejoin="round" paint-order="stroke">THE END</text>
<g class="q"><text class="b" x="300" y="104" font-size="84" fill="#f7c548" stroke="#1d1a16" stroke-width="7" stroke-linejoin="round" paint-order="stroke">?</text></g>
<rect x="380" y="34" width="560" height="84" fill="#f7c548" stroke="#1d1a16" stroke-width="4.5"/>
<g class="c" fill="#1d1a16">
  <text x="400" y="66" font-size="19">NEXT ISSUE: Season 2 keeps going.</text>
  <text x="400" y="94" font-size="15" font-weight="400">Whatever gets built next, it'll be in the commits first.</text>
</g>
<g class="hop">
  <path d="M1012 116L1008 134M1036 116L1040 134" stroke="#1d1a16" stroke-width="4" stroke-linecap="round"/>
  <rect x="990" y="30" width="68" height="90" rx="8" fill="#d9cdb0" stroke="#1d1a16" stroke-width="4"/>
  <circle cx="1024" cy="62" r="22" fill="#efe6cf" stroke="#1d1a16" stroke-width="3.5"/>
  <circle cx="1024" cy="62" r="5" fill="#1d1a16"/>
  <circle cx="1012" cy="98" r="4" fill="#1d1a16"/><circle cx="1036" cy="98" r="4" fill="#1d1a16"/>
  <path d="M1016 107Q1024 113 1032 107" fill="none" stroke="#1d1a16" stroke-width="3" stroke-linecap="round"/>
</g>
<text class="b" x="1070" y="54" font-size="20" letter-spacing="1" fill="#1d1a16" transform="rotate(8 1070 54)">bye!</text>
<g class="m" font-size="9.5" font-weight="600" letter-spacing="1.4" fill="#1d1a16" opacity=".55">
