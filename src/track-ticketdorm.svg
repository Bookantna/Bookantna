  <rect x="158" y="250" width="60" height="34" rx="17" fill="#1d1a16"/><rect x="154" y="246" width="60" height="34" rx="17" fill="#fffaf0" stroke="#1d1a16" stroke-width="3"/><text x="184" y="268">JPA</text>
  <rect x="230" y="250" width="72" height="34" rx="17" fill="#1d1a16"/><rect x="226" y="246" width="72" height="34" rx="17" fill="#fffaf0" stroke="#1d1a16" stroke-width="3"/><text x="262" y="268">SOLID</text>
</g>

