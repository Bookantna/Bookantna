<svg xmlns="http://www.w3.org/2000/svg" width="708" height="320" viewBox="0 0 708 320" role="img" aria-labelledby="t d">
<title id="t">Episode 05: ticketDorm</title>
<desc id="d">ticketDorm, in: the leaky faucet of room B-214. A dorm maintenance request system, from report to repair. A layered Java Spring Boot service with JPA, built around SOLID principles. Art: a dripping faucet, a ticket moving from open to assigned to resolved, and a fixed stamp.</desc>
<style>
/*FONTS*/
.b{font-family:'Bangers',Impact,sans-serif}
.c{font-family:'Comic Neue','Comic Sans MS',cursive;font-weight:700}
.r{font-weight:400}
.m{font-family:'Geist Mono',ui-monospace,monospace}
.in{animation:in .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.drop{animation:drop 6s cubic-bezier(.55,0,1,.45) infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}10%{transform:translateY(64px);opacity:1}11%,100%{transform:translateY(64px);opacity:0}}
.d2{animation-delay:1s}.d3{animation-delay:2s}
.drip{animation:drip 6s steps(1) infinite}
@keyframes drip{0%,64%{opacity:1}65%,100%{opacity:0}}
.prog{transform-box:fill-box;transform-origin:0 50%;animation:prog 6s cubic-bezier(.65,0,.35,1) infinite}
@keyframes prog{0%,8%{transform:scaleX(0)}30%,40%{transform:scaleX(.5)}62%,100%{transform:scaleX(1)}}
.s1{animation:s1 6s steps(1) infinite}@keyframes s1{0%,100%{fill:#e4432d}}
.s2{animation:s2 6s steps(1) infinite}@keyframes s2{0%,29%{fill:#fffaf0}30%,100%{fill:#e4432d}}
.s3{animation:s3 6s steps(1) infinite}@keyframes s3{0%,61%{fill:#fffaf0}62%,100%{fill:#e4432d}}
.fixed{transform-origin:600px 236px;animation:fixed 6s cubic-bezier(.34,1.56,.64,1) infinite both}
@keyframes fixed{0%,64%{opacity:0;transform:rotate(-12deg) scale(2)}72%,95%{opacity:1;transform:rotate(-12deg)}100%{opacity:0;transform:rotate(-12deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="708" height="320" rx="6" fill="#fffaf0"/>
<rect x="3" y="3" width="702" height="314" rx="6" fill="none" stroke="#1d1a16" stroke-width="6"/>

<rect x="26" y="26" width="138" height="30" fill="#1d1a16"/>
<text class="m" x="40" y="46" font-size="12" font-weight="700" letter-spacing="2" fill="#f7c548">EPISODE 05</text>
<text class="m" x="176" y="46" font-size="10.5" font-weight="600" letter-spacing="1.4" fill="#1d1a16" opacity=".6">JAVA / SPRING BOOT</text>
<g class="in">
  <text class="b" x="24" y="114" font-size="58" letter-spacing="2" fill="#f7c548" stroke="#1d1a16" stroke-width="6" stroke-linejoin="round" paint-order="stroke">TICKETDORM</text>
  <text class="c" x="26" y="142" font-size="16" fill="#e4432d">IN: THE LEAKY FAUCET OF B-214</text>
</g>
<g class="c r in" style="animation-delay:.12s" font-size="15.5" fill="#1d1a16">
  <text x="26" y="174">Dorm maintenance requests, from</text>
  <text x="26" y="196">report to repair. A layered Spring</text>
  <text x="26" y="218">Boot service built around SOLID.</text>
</g>
<g class="in c" style="animation-delay:.3s" font-size="14" text-anchor="middle">
