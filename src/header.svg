<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">Thanawat Ueasiripracha</title>
<desc id="d">A hard-drive datasheet label for Thanawat Ueasiripracha, aspiring data engineer, CS student at Khon Kaen University, manufacturing intern at Seagate. A spinning platter with a seeking read head sits on the right.</desc>
<style>
/*FONTS*/
.s{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}
.m{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.rise{animation:rise 1.1s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.d1{animation-delay:.15s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.48s}
.d5{animation-delay:.56s}.d6{animation-delay:.64s}.d7{animation-delay:.72s}.d8{animation-delay:.85s}
.label{animation:lift 1.2s cubic-bezier(.16,1,.3,1) both}
@keyframes lift{from{opacity:0;transform:translateY(16px) rotate(-.6deg)}to{opacity:1;transform:none}}
.spin{transform-origin:920px 280px;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.arm{transform-origin:1112px 466px;animation:seek 9s cubic-bezier(.65,0,.35,1) infinite}
@keyframes seek{
0%,8%{transform:rotate(19deg)}18%,34%{transform:rotate(35deg)}
42%,56%{transform:rotate(24deg)}66%,84%{transform:rotate(39deg)}94%,100%{transform:rotate(19deg)}}
.led{animation:led 9s steps(1) infinite}
@keyframes led{
0%,9%{opacity:.25}10%,12%{opacity:1}13%,15%{opacity:.25}16%,19%{opacity:1}20%,35%{opacity:.25}
36%,37%{opacity:1}38%,43%{opacity:.25}44%,47%{opacity:1}48%,64%{opacity:.25}65%,66%{opacity:1}
67%,69%{opacity:.25}70%,74%{opacity:1}75%,100%{opacity:.25}}
.scan{animation:scan 5s cubic-bezier(.65,0,.35,1) 1.6s infinite both}
@keyframes scan{0%{transform:translateX(0);opacity:0}6%{opacity:1}40%{transform:translateX(188px);opacity:1}46%,100%{transform:translateX(188px);opacity:0}}
.lba text{opacity:0;animation:lba 9s steps(1) infinite}
.lba text:nth-child(2){animation-delay:3s}.lba text:nth-child(3){animation-delay:6s}
@keyframes lba{0%{opacity:1}33.3%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.lba text:first-child{opacity:1}}
</style>
<defs>
  <radialGradient id="disc" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#34322e"/>
    <stop offset=".22" stop-color="#1d1c1a"/>
    <stop offset=".7" stop-color="#252421"/>
    <stop offset=".97" stop-color="#2f2d29"/>
    <stop offset="1" stop-color="#3d3b36"/>
  </radialGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".16"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="hub" cx="40%" cy="35%" r="70%">
    <stop offset="0" stop-color="#5a5852"/>
    <stop offset=".6" stop-color="#2c2b28"/>
    <stop offset="1" stop-color="#1a1918"/>
  </radialGradient>
  <linearGradient id="armg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5d5b55"/>
    <stop offset=".5" stop-color="#3b3a36"/>
    <stop offset="1" stop-color="#262522"/>
  </linearGradient>
  <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#050505" flood-opacity=".55"/>
  </filter>
  <filter id="armshadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="6" dy="10" stdDeviation="6" flood-color="#050505" flood-opacity=".6"/>
  </filter>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r=".9" fill="#e9e6df" fill-opacity=".07"/>
  </pattern>
  <radialGradient id="fade" cx="920" cy="280" r="330" gradientUnits="userSpaceOnUse">
    <stop offset=".55" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="dotmask"><rect width="1200" height="560" fill="url(#fade)"/></mask>
  <clipPath id="discclip"><circle cx="920" cy="280" r="200"/></clipPath>
  <clipPath id="panel"><rect width="1200" height="560" rx="22"/></clipPath>
</defs>

<g clip-path="url(#panel)">
<rect width="1200" height="560" fill="#121211"/>
<rect x="640" width="560" height="560" fill="url(#dots)" mask="url(#dotmask)"/>

<!-- top-right instrument readout -->
<g class="m" font-size="11" letter-spacing="1.4" fill="#6f6c65">
  <text x="684" y="52">FIG.01 — PROFILE.BIN</text>
  <text x="1136" y="52" text-anchor="end">ACT</text>
</g>
<circle class="led" cx="1150" cy="48" r="4" fill="#e2a03f"/>

<!-- drive well -->
<circle cx="920" cy="280" r="214" fill="#0b0b0a"/>
<circle cx="920" cy="280" r="214" fill="none" stroke="#2a2926"/>
<circle cx="920" cy="280" r="207" fill="none" stroke="#1a1917" stroke-width="6"/>

<!-- platter -->
<circle cx="920" cy="280" r="200" fill="url(#disc)"/>
<g fill="none" stroke="#e9e6df">
  <circle cx="920" cy="280" r="192" stroke-opacity=".05"/>
  <circle cx="920" cy="280" r="180" stroke-opacity=".03"/>
  <circle cx="920" cy="280" r="168" stroke-opacity=".05"/>
  <circle cx="920" cy="280" r="156" stroke-opacity=".03"/>
  <circle cx="920" cy="280" r="144" stroke-opacity=".05"/>
  <circle cx="920" cy="280" r="132" stroke-opacity=".03"/>
  <circle cx="920" cy="280" r="120" stroke-opacity=".05"/>
  <circle cx="920" cy="280" r="108" stroke-opacity=".03"/>
  <circle cx="920" cy="280" r="96" stroke-opacity=".05"/>
  <circle cx="920" cy="280" r="84" stroke-opacity=".03"/>
  <circle cx="920" cy="280" r="72" stroke-opacity=".06"/>
</g>

<!-- written sectors: rotate with the platter -->
<g class="spin">
  <g fill="none" stroke="#e2a03f" stroke-linecap="butt">
    <circle cx="920" cy="280" r="186" stroke-width="5" stroke-opacity=".55" stroke-dasharray="38 120 14 260 70 666"/>
    <circle cx="920" cy="280" r="174" stroke-width="5" stroke-opacity=".3" stroke-dasharray="120 80 22 400 30 441"/>
    <circle cx="920" cy="280" r="150" stroke-width="5" stroke-opacity=".5" stroke-dasharray="18 60 90 300 12 462"/>
    <circle cx="920" cy="280" r="138" stroke-width="5" stroke-opacity=".22" stroke-dasharray="200 667"/>
    <circle cx="920" cy="280" r="114" stroke-width="5" stroke-opacity=".45" stroke-dasharray="40 30 16 200 50 380"/>
    <circle cx="920" cy="280" r="90" stroke-width="5" stroke-opacity=".3" stroke-dasharray="70 495"/>
  </g>
  <g stroke="#e9e6df" stroke-opacity=".08">
    <path d="M920 80V208M920 352V480M720 280H848M992 280H1120"/>
    <path d="M778.6 138.6l90.5 90.5M970.9 330.9l90.5 90.5M1061.4 138.6l-90.5 90.5M869.1 330.9l-90.5 90.5" stroke-opacity=".05"/>
  </g>
  <!-- hub + clamp screws -->
  <circle cx="920" cy="280" r="54" fill="#141413" stroke="#2f2e2b"/>
  <circle cx="920" cy="280" r="46" fill="url(#hub)" stroke="#5a5852" stroke-opacity=".5"/>
  <g fill="#121211" stroke="#6f6c65" stroke-opacity=".5">
    <circle cx="920" cy="247" r="4.5"/><circle cx="948.6" cy="263.5" r="4.5"/><circle cx="948.6" cy="296.5" r="4.5"/>
    <circle cx="920" cy="313" r="4.5"/><circle cx="891.4" cy="296.5" r="4.5"/><circle cx="891.4" cy="263.5" r="4.5"/>
  </g>
  <circle cx="920" cy="280" r="14" fill="#1a1918" stroke="#4a4843"/>
  <circle cx="920" cy="280" r="4" fill="#e2a03f"/>
</g>

<!-- static reflections: light stays put while the disc turns -->
<g clip-path="url(#discclip)" filter="url(#blur)">
  <path d="M920 280L760 60L860 40Z" fill="url(#sheen)"/>
  <path d="M920 280L1080 500L980 520Z" fill="url(#sheen)" opacity=".7"/>
</g>

<!-- actuator arm -->
<g filter="url(#armshadow)">
  <g transform="rotate(223.5 1112 466)">
    <g class="arm">
      <path d="M1112 442L1346 461Q1360 462 1360 466Q1360 470 1346 471L1112 490Z" fill="url(#armg)"/>
      <path d="M1136 447L1340 463.5" stroke="#8a877f" stroke-opacity=".35"/>
      <path d="M1170 459L1270 463.5Q1274 466 1270 468.5L1170 473Q1164 466 1170 459Z" fill="#141413" stroke="#4a4843" stroke-width=".8"/>
      <rect x="1350" y="459" width="20" height="14" rx="2.5" fill="#6f6c65"/>
      <circle cx="1364" cy="466" r="2.6" fill="#e2a03f"/>
    </g>
  </g>
  <circle cx="1112" cy="466" r="34" fill="#232220" stroke="#3b3a36"/>
  <circle cx="1112" cy="466" r="22" fill="url(#hub)" stroke="#5a5852" stroke-opacity=".6"/>
  <circle cx="1112" cy="466" r="6" fill="#121211" stroke="#6f6c65"/>
</g>

<!-- rotating LBA readout -->
<g class="lba m" font-size="11" letter-spacing="1" fill="#6f6c65">
  <text x="684" y="516">LBA 0x0001F3A2  ·  READ  ·  TRK 0412</text>
  <text x="684" y="516">LBA 0x0007C91E  ·  READ  ·  TRK 1873</text>
  <text x="684" y="516">LBA 0x00031B07  ·  WRITE ·  TRK 0966</text>
</g>

<!-- the label -->
<g class="label">
<g filter="url(#shadow)">
  <rect x="40" y="40" width="600" height="480" rx="12" fill="#ece7dc"/>
</g>
<rect x="40.5" y="40.5" width="599" height="479" rx="11.5" fill="none" stroke="#fff" stroke-opacity=".6"/>

<g class="m rise d1" font-size="11" letter-spacing="1.6" fill="#7a7468">
  <text x="76" y="82">BOOKANTNA / PROFILE</text>
  <text x="604" y="82" text-anchor="end">REV 2026.10</text>
</g>
<path class="rise d1" d="M76 98H604" stroke="#cfc8b9"/>

<g class="s rise d2" font-weight="620" font-size="56" letter-spacing="-2.4" fill="#1d1c1a">
  <text x="72" y="164">Thanawat</text>
  <text x="72" y="222">Ueasiripracha</text>
</g>

<g class="s rise d3" font-size="15.5" fill="#5f5a51">
  <text x="76" y="264">Data engineer in training. I build pipelines, check whether</text>
  <text x="76" y="288">models hold up off their own benchmark, and ship small tools.</text>
</g>

<path class="rise d3" d="M76 316H604" stroke="#cfc8b9"/>
<g class="m" font-size="12.5">
  <g class="rise d4"><text x="76" y="344" fill="#8a8377" letter-spacing="1.2" font-size="10.5">ROLE</text><text x="168" y="344" fill="#1d1c1a">Aspiring data engineer</text></g>
  <g class="rise d5"><text x="76" y="370" fill="#8a8377" letter-spacing="1.2" font-size="10.5">STUDY</text><text x="168" y="370" fill="#1d1c1a">Computer Science, Khon Kaen University</text></g>
  <g class="rise d6"><text x="76" y="396" fill="#8a8377" letter-spacing="1.2" font-size="10.5">FIELD</text><text x="168" y="396" fill="#1d1c1a">Manufacturing intern, Seagate</text></g>
  <g class="rise d7"><text x="76" y="422" fill="#8a8377" letter-spacing="1.2" font-size="10.5">TZ</text><text x="168" y="422" fill="#1d1c1a">Asia/Bangkok, UTC+07:00</text></g>
</g>

<g class="rise d8">
  {{BARCODE 76 444 1.4 40 #1d1c1a}}
  <rect class="scan" x="74" y="440" width="2" height="48" fill="#e2a03f"/>
  <g class="m" font-size="10.5" letter-spacing="1.2" fill="#7a7468">
    <text x="286" y="456">S/N  TU-0412-KKU</text>
    <text x="286" y="474">P/N  DATA-ENG-01</text>
    <text x="286" y="492" fill="#a39c8f">MADE IN KHON KAEN, TH</text>
  </g>
  <!-- QC stamp -->
  <g transform="rotate(-9 562 462)">
    <circle cx="562" cy="462" r="30" fill="none" stroke="#c98a2e" stroke-width="1.6"/>
    <circle cx="562" cy="462" r="25" fill="none" stroke="#c98a2e" stroke-width=".8"/>
    <text class="m" x="562" y="459" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1.4" fill="#c98a2e">QC</text>
    <text class="m" x="562" y="472" text-anchor="middle" font-size="7.5" letter-spacing="1" fill="#c98a2e">PASSED</text>
  </g>
</g>
</g>
</g>
<rect x=".5" y=".5" width="1199" height="559" rx="21.5" fill="none" stroke="#2a2926"/>
</svg>
