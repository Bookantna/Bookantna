<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d">
<title id="t">The Amazing Bookantna, Season 2, Issue 01</title>
<desc id="d">A comic book cover for Thanawat Ueasiripracha, data engineer in training and Computer Science student at Khon Kaen University. A masked hero in round glasses stands in front of a starburst asking: but does it generalize? A retired hard drive sidekick waves beside them. Cover blurb: Seagate arc complete.</desc>
<style>
/*FONTS*/
.b{font-family:'Bangers',Impact,sans-serif}
.c{font-family:'Comic Neue','Comic Sans MS',cursive;font-weight:700}
.m{font-family:'Geist Mono',ui-monospace,monospace}
.slam{transform-origin:450px 150px;animation:slam .7s cubic-bezier(.34,1.56,.64,1) both}
@keyframes slam{from{opacity:0;transform:scale(1.5) rotate(-3deg)}to{opacity:1;transform:none}}
.in{animation:in .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.d1{animation-delay:.35s}.d2{animation-delay:.5s}.d3{animation-delay:.65s}
.pop{transform-origin:1050px 205px;animation:pop .55s cubic-bezier(.34,1.56,.64,1) 1.1s both}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
.wob{transform-origin:478px 530px;animation:wob 2.2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-9deg) scale(1)}50%{transform:rotate(-4deg) scale(1.05)}}
.spin{transform-origin:930px 370px;animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.throb{transform-origin:930px 370px;animation:throb 3s ease-in-out infinite}
@keyframes throb{50%{transform:scale(1.035) rotate(2deg)}}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.cape{transform-origin:930px 486px;animation:cape 2.6s ease-in-out infinite}
@keyframes cape{0%,100%{transform:skewX(-2.5deg)}50%{transform:skewX(2.5deg)}}
.blink{transform-origin:930px 406px;animation:blink 4.6s infinite}
@keyframes blink{0%,92%,100%{transform:none}95%{transform:scaleY(.08)}}
.glint{animation:glint 3.8s cubic-bezier(.65,0,.35,1) 1.6s infinite both}
@keyframes glint{0%{transform:translateX(0)}35%,100%{transform:translateX(130px)}}
.wave{transform-origin:776px 560px;animation:wave 1.1s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(18deg)}}
.hop{animation:hop 1.4s cubic-bezier(.5,0,.5,1) infinite}
@keyframes hop{0%,100%{transform:none}50%{transform:translateY(-6px)}}
.click{animation:click 2.8s steps(1) infinite}
.click text+text{animation-delay:-1.4s}
@keyframes click{0%,49%{opacity:1}50%,100%{opacity:0}}
.scan{animation:scan 3s cubic-bezier(.65,0,.35,1) 1.5s infinite both}
@keyframes scan{0%{transform:translateX(0);opacity:0}8%{opacity:1}60%{transform:translateX(196px);opacity:1}66%,100%{transform:translateX(196px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.click text+text{opacity:0}}
</style>
<defs>
  <pattern id="htr" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
    <circle cx="4" cy="4" r="2.3" fill="#e4432d"/>
  </pattern>
  <pattern id="htk" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
    <circle cx="3.5" cy="3.5" r="1.5" fill="#1d1a16"/>
  </pattern>
  <pattern id="hty" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
    <circle cx="5" cy="5" r="2.6" fill="#f7c548"/>
  </pattern>
  <linearGradient id="fadeDown" x1="0" y1="0" x2="0" y2="1">
    <stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/>
  </linearGradient>
  <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="mastMask"><rect x="0" y="90" width="1200" height="130" fill="url(#fadeDown)"/></mask>
  <mask id="paperMask"><rect width="640" height="660" fill="url(#fadeLeft)"/></mask>
  <clipPath id="page"><rect x="3" y="3" width="1194" height="654" rx="6"/></clipPath>
  <clipPath id="lenses"><circle cx="904" cy="404" r="21"/><circle cx="956" cy="404" r="21"/></clipPath>
</defs>

<g clip-path="url(#page)">
<rect width="1200" height="660" fill="#f4ecd6"/>
<rect y="40" width="640" height="620" fill="url(#hty)" mask="url(#paperMask)" opacity=".55"/>

<!-- cover art: rays, burst, hero -->
<g class="spin"><path d="{{RAYS 930 370 120 760 72 7}}" fill="#1d1a16" opacity=".9"/></g>
<g class="throb">
  <path d="{{BURST 930 370 170 300 15 4}}" fill="#f7c548" stroke="#1d1a16" stroke-width="5" stroke-linejoin="round"/>
  <path d="{{BURST 930 370 120 205 13 9}}" fill="url(#htr)" opacity=".55"/>
</g>

<g class="bob">
  <!-- cape -->
  <path class="cape" d="M760 670C784 572 826 506 880 488L980 488C1034 506 1076 572 1100 670Z" fill="#e4432d" stroke="#1d1a16" stroke-width="5" stroke-linejoin="round"/>
  <path class="cape" d="M812 670C826 600 850 546 884 520M1048 670C1034 600 1010 546 976 520" fill="none" stroke="#1d1a16" stroke-width="3" stroke-linecap="round" opacity=".5"/>
  <!-- suit -->
  <path d="M806 670C810 584 846 532 898 520L962 520C1014 532 1050 584 1054 670Z" fill="#f7c548" stroke="#1d1a16" stroke-width="5" stroke-linejoin="round"/>
  <path d="M1054 670C1050 600 1030 556 1000 536C1018 572 1024 620 1022 670Z" fill="url(#htr)" opacity=".7"/>
  <path d="M890 522Q930 556 970 522" fill="none" stroke="#1d1a16" stroke-width="4" stroke-linecap="round"/>
  <!-- chest emblem -->
  <path d="M930 562L972 604L930 646L888 604Z" fill="#e4432d" stroke="#1d1a16" stroke-width="5" stroke-linejoin="round"/>
  <text class="m" x="930" y="614" text-anchor="middle" font-size="27" font-weight="800" fill="#f4ecd6">{ }</text>
  <!-- neck -->
  <path d="M906 468V528Q930 540 954 528V468Z" fill="#eebd8f" stroke="#1d1a16" stroke-width="5" stroke-linejoin="round"/>
  <path d="M906 486Q930 500 954 486V478H906Z" fill="#1d1a16" opacity=".22"/>
  <!-- ears -->
  <ellipse cx="866" cy="412" rx="11" ry="17" fill="#f2c99c" stroke="#1d1a16" stroke-width="4.5"/>
  <ellipse cx="994" cy="412" rx="11" ry="17" fill="#f2c99c" stroke="#1d1a16" stroke-width="4.5"/>
  <!-- head -->
  <path d="M866 396C866 336 896 318 930 318C964 318 994 336 994 396C994 450 966 484 930 484C894 484 866 450 866 396Z" fill="#f2c99c" stroke="#1d1a16" stroke-width="5"/>
  <path d="M993 396C993 450 966 483 930 483C958 470 978 440 979 398C980 366 972 344 960 330C982 342 993 364 993 396Z" fill="url(#htk)" opacity=".35"/>
  <!-- hair -->
  <path d="M858 398C844 352 856 314 882 300L874 270L904 288L910 254L936 282L958 250L964 284L994 268L988 300C1010 316 1014 360 1002 398C994 366 976 346 952 340C930 356 894 356 876 344C866 360 862 378 858 398Z" fill="#1d1a16" stroke="#1d1a16" stroke-width="4" stroke-linejoin="round"/>
  <path d="M900 300Q916 290 934 296M950 288Q966 284 978 294" fill="none" stroke="#f4ecd6" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  <!-- brows -->
  <path d="M882 366L916 374M944 374L978 366" stroke="#1d1a16" stroke-width="6" stroke-linecap="round"/>
  <!-- domino mask -->
  <path d="M864 390C882 376 978 376 996 390L998 422C978 434 882 434 862 422Z" fill="#e4432d" stroke="#1d1a16" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- glasses (over the mask, obviously) -->
  <circle cx="904" cy="404" r="24" fill="#fffaf0" stroke="#1d1a16" stroke-width="5"/>
  <circle cx="956" cy="404" r="24" fill="#fffaf0" stroke="#1d1a16" stroke-width="5"/>
  <path d="M927 401Q930 394 933 401M880 400L866 395M980 400L994 395" fill="none" stroke="#1d1a16" stroke-width="4.5" stroke-linecap="round"/>
  <g class="blink">
    <circle cx="908" cy="407" r="6.5" fill="#1d1a16"/><circle cx="952" cy="407" r="6.5" fill="#1d1a16"/>
    <circle cx="910.5" cy="404.5" r="2" fill="#fffaf0"/><circle cx="954.5" cy="404.5" r="2" fill="#fffaf0"/>
  </g>
  <g clip-path="url(#lenses)">
    <path class="glint" d="M866 440L900 370L910 370L876 440ZM882 440L916 370L921 370L887 440Z" fill="#f7c548" opacity=".85"/>
  </g>
  <!-- nose, smirk, blush -->
  <path d="M930 424Q938 436 928 438" fill="none" stroke="#1d1a16" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M904 452Q932 466 958 446M955 442L962 450" fill="none" stroke="#1d1a16" stroke-width="4" stroke-linecap="round"/>
  <path d="M880 440l-4 9M888 440l-4 9M896 440l-4 9M974 440l-4 9M982 440l-4 9" stroke="#e4432d" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- sidekick: a retired hard drive -->
<g class="hop">
  <path d="M736 640L730 662M762 640L768 662" stroke="#1d1a16" stroke-width="5" stroke-linecap="round"/>
  <g transform="rotate(-8 750 580)">
    <rect x="702" y="510" width="96" height="132" rx="10" fill="#d9cdb0" stroke="#1d1a16" stroke-width="5"/>
    <circle cx="750" cy="556" r="34" fill="#efe6cf" stroke="#1d1a16" stroke-width="4"/>
    <circle cx="750" cy="556" r="22" fill="none" stroke="#1d1a16" stroke-width="1.5" opacity=".4"/>
    <circle cx="750" cy="556" r="7" fill="#1d1a16"/>
    <path d="M786 520L760 552" stroke="#1d1a16" stroke-width="5" stroke-linecap="round"/>
    <circle cx="733" cy="612" r="5" fill="#1d1a16"/><circle cx="767" cy="612" r="5" fill="#1d1a16"/>
    <path d="M740 624Q750 632 760 624" fill="none" stroke="#1d1a16" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="712" cy="520" r="2.5" fill="#1d1a16"/><circle cx="788" cy="632" r="2.5" fill="#1d1a16"/>
  </g>
  <g class="wave">
    <path d="M700 580L672 548" stroke="#1d1a16" stroke-width="5" stroke-linecap="round"/>
    <circle cx="668" cy="543" r="8" fill="#f4ecd6" stroke="#1d1a16" stroke-width="4"/>
  </g>
</g>
<g class="click b" font-size="22" fill="#1d1a16" letter-spacing="1">
  <text x="796" y="500" transform="rotate(-10 796 500)">click.</text>
  <text x="816" y="474" transform="rotate(8 816 474)">clack.</text>
</g>

<!-- speech bubble -->
<g class="pop">
  <path d="M1052 66C1118 66 1170 100 1170 146C1170 192 1118 224 1052 224C1036 224 1022 222 1008 218L982 276L990 210C956 196 934 172 934 146C934 100 986 66 1052 66Z" fill="#fffaf0" stroke="#1d1a16" stroke-width="5" stroke-linejoin="round"/>
  <g class="c" text-anchor="middle" fill="#1d1a16">
    <text x="1052" y="126" font-size="20">BUT DOES IT</text>
    <text x="1052" y="164" font-size="34" class="b" letter-spacing="1.5" fill="#e4432d">GENERALIZE?!</text>
    <text x="1052" y="192" font-size="13" font-weight="400" opacity=".7">(asks every model, always)</text>
  </g>
</g>

<!-- top strip -->
<rect width="1200" height="40" fill="#1d1a16"/>
<text class="m" x="28" y="26" font-size="12" font-weight="600" letter-spacing="2.4" fill="#f4ecd6">BOOKANTNA COMICS<tspan fill="#f7c548">  /  </tspan>SEASON 2<tspan fill="#f7c548">  /  </tspan>ISSUE 01<tspan fill="#f7c548">  /  </tspan>OCT 2026</text>
<text class="b" x="1172" y="30" text-anchor="end" font-size="22" letter-spacing="1.5" fill="#f7c548">ALL-NEW! ALL-DATA!</text>

<!-- corner box -->
<g class="in">
  <rect x="28" y="62" width="112" height="150" fill="#fffaf0" stroke="#1d1a16" stroke-width="5"/>
  <text class="b" x="84" y="94" text-anchor="middle" font-size="22" letter-spacing="1" fill="#e4432d">No.</text>
  <text class="b" x="84" y="160" text-anchor="middle" font-size="72" fill="#1d1a16">01</text>
  <path d="M40 174H128" stroke="#1d1a16" stroke-width="2"/>
  <text class="m" x="84" y="194" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#1d1a16">0 THB</text>
</g>

<!-- masthead -->
<g class="slam">
  <g transform="rotate(-6 196 76)">
    <rect x="166" y="54" width="218" height="40" fill="#e4432d" stroke="#1d1a16" stroke-width="4.5"/>
    <text class="b" x="275" y="85" text-anchor="middle" font-size="30" letter-spacing="2.5" fill="#fffaf0">THE AMAZING</text>
  </g>
  <g class="b" font-size="152" letter-spacing="1">
    <text x="168" y="226" fill="#1d1a16" stroke="#1d1a16" stroke-width="10" stroke-linejoin="round">BOOKANTNA</text>
    <text x="158" y="216" fill="#f7c548" stroke="#1d1a16" stroke-width="8" stroke-linejoin="round" paint-order="stroke">BOOKANTNA</text>
    <text x="158" y="216" fill="url(#htr)" mask="url(#mastMask)">BOOKANTNA</text>
  </g>
</g>

<!-- captions -->
<g class="in d1">
  <rect x="30" y="256" width="560" height="98" fill="#f7c548" stroke="#1d1a16" stroke-width="4.5"/>
  <g class="c" font-size="19" fill="#1d1a16">
    <text x="50" y="288">MEET THANAWAT UEASIRIPRACHA.</text>
    <text x="50" y="314" font-weight="400">Data engineer in training. Computer Science</text>
    <text x="50" y="338" font-weight="400">student at Khon Kaen University, Thailand.</text>
  </g>
</g>
<g class="in d2">
  <rect x="58" y="370" width="540" height="76" fill="#fffaf0" stroke="#1d1a16" stroke-width="4.5"/>
  <g class="c" font-size="17" fill="#1d1a16">
    <text x="78" y="401"><tspan fill="#e4432d">BY DAY:</tspan> builds data pipelines that don't leak.</text>
    <text x="78" y="427"><tspan fill="#e4432d">BY NIGHT:</tspan> ships tiny tools nobody asked for.</text>
  </g>
</g>

<!-- barcode box + stamp -->
<g class="in d3">
  <rect x="30" y="500" width="236" height="132" fill="#fffaf0" stroke="#1d1a16" stroke-width="4.5"/>
  {{BARCODE 46 516 1.45 72 #1d1a16}}
  <rect class="scan" x="44" y="512" width="3" height="80" fill="#e4432d"/>
  <text class="m" x="46" y="614" font-size="11" font-weight="700" letter-spacing="2.2" fill="#1d1a16">BOOKANTNA</text>
  <text class="m" x="250" y="614" text-anchor="end" font-size="11" letter-spacing="1" fill="#1d1a16">S2 #01</text>
  <g transform="rotate(-12 330 590)">
    <circle cx="330" cy="590" r="44" fill="#fffaf0" stroke="#1d1a16" stroke-width="4"/>
    <circle cx="330" cy="590" r="36" fill="none" stroke="#1d1a16" stroke-width="1.5"/>
    <g class="b" text-anchor="middle" fill="#1d1a16">
      <text x="330" y="577" font-size="12" letter-spacing="1.5">APPROVED BY</text>
      <text x="330" y="600" font-size="23" fill="#e4432d" letter-spacing="1">PEP 8</text>
      <text x="330" y="615" font-size="12" letter-spacing="1.5">AUTHORITY</text>
    </g>
  </g>
</g>

<!-- cover blurb -->
<g class="wob">
  <path d="{{BURST 478 530 72 112 12 21}}" fill="#e4432d" stroke="#1d1a16" stroke-width="5" stroke-linejoin="round"/>
  <g class="b" text-anchor="middle" fill="#f7c548" stroke="#1d1a16" stroke-width="5" stroke-linejoin="round" paint-order="stroke" letter-spacing="1">
    <text x="478" y="514" font-size="24">SEAGATE ARC</text>
    <text x="478" y="550" font-size="38">COMPLETE!</text>
  </g>
</g>
</g>
<rect x="3" y="3" width="1194" height="654" rx="6" fill="none" stroke="#1d1a16" stroke-width="6"/>
</svg>
