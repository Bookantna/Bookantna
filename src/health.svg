<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="292" viewBox="0 0 1200 292" role="img" aria-labelledby="t d">
<title id="t">Health report</title>
<desc id="d">Current focus: data pipelines and model evaluation. Now building: phishMe and Screenie. Ask me about: data leakage and text-to-SQL agents. Contribution map for the last 52 weeks: {{TOTAL}} contributions over {{ACTIVE}} active days.</desc>
<style>
/*FONTS*/
.s{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}
.m{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.rise{animation:rise 1s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.col{animation:col .6s ease-out both}
@keyframes col{from{opacity:0}to{opacity:1}}
.breath{transform-box:fill-box;transform-origin:center;animation:breath 2.6s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(.6);opacity:.35}50%{transform:scale(1.6);opacity:0}}
.head{animation:sweep 12s cubic-bezier(.65,0,.35,1) 2s infinite alternate both}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(530px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.breath,.head{display:none}}
</style>
<rect width="1200" height="292" rx="22" fill="#121211"/>
<rect x=".5" y=".5" width="1199" height="291" rx="21.5" fill="none" stroke="#2a2926"/>

<g class="m" font-size="11" letter-spacing="1.4">
  <text x="48" y="58" fill="#e2a03f">03<tspan fill="#6f6c65">  /  HEALTH</tspan></text>
  <text x="1152" y="58" text-anchor="end" fill="#6f6c65">$ smartctl -a /dev/thanawat</text>
</g>

<!-- SMART attributes -->
<g class="m" font-size="9.5" letter-spacing="1.4" fill="#5a5852">
  <text x="48" y="100">ID#</text><text x="96" y="100">ATTRIBUTE_NAME</text><text x="290" y="100">RAW_VALUE</text>
</g>
<path d="M48 110H560" stroke="#232321"/>
<g class="m" font-size="12.5">
  <g class="rise" style="animation-delay:.2s"><text x="48" y="136" fill="#6f6c65">001</text><text x="96" y="136" fill="#8a877f">Current_Focus</text><text x="290" y="136" fill="#e9e6df">Data pipelines, model eval</text></g>
  <g class="rise" style="animation-delay:.3s"><text x="48" y="162" fill="#6f6c65">009</text><text x="96" y="162" fill="#8a877f">Now_Building</text><text x="290" y="162" fill="#e9e6df">phishMe, Screenie</text></g>
  <g class="rise" style="animation-delay:.4s"><text x="48" y="188" fill="#6f6c65">0C2</text><text x="96" y="188" fill="#8a877f">Ask_Me_About</text><text x="290" y="188" fill="#e9e6df">Data leakage, text-to-SQL</text></g>
  <g class="rise" style="animation-delay:.5s"><text x="48" y="214" fill="#6f6c65">0BB</text><text x="96" y="214" fill="#8a877f">Reported_Uncorrect</text><text x="290" y="214" fill="#e9e6df">0</text></g>
</g>
<path d="M48 230H560" stroke="#232321"/>
<g class="rise" style="animation-delay:.7s">
  <text class="m" x="48" y="252" font-size="10.5" letter-spacing=".8" fill="#6f6c65">overall-health self-assessment</text>
  <circle class="breath" cx="486" cy="248.5" r="5" fill="#e2a03f"/>
  <circle cx="486" cy="248.5" r="3.5" fill="#e2a03f"/>
  <text class="m" x="560" y="252" text-anchor="end" font-size="11" font-weight="600" letter-spacing="1.6" fill="#e2a03f">PASSED</text>
</g>

<path d="M592 92V258" stroke="#232321"/>

<!-- contribution sector map -->
<g class="m" font-size="9.5" letter-spacing="1.4" fill="#5a5852">
  <text x="622" y="100">SECTOR MAP  ·  52 WEEKS  ·  AS OF {{UPDATED}}</text>
  {{LEGEND 1152 100}}
</g>
{{HEATMAP 622 114 10 8}}
<rect class="head" x="621" y="110" width="1.5" height="78" fill="#ece7dc" opacity=".7"/>
<g class="m" font-size="9" letter-spacing="1.2" fill="#5a5852">
  {{MONTHS 622 204 10}}
</g>
<g class="rise" style="animation-delay:.6s">
  <g class="m" font-size="22" fill="#e9e6df">
    <text x="622" y="236">{{TOTAL}}</text><text x="756" y="236">{{ACTIVE}}</text><text x="890" y="236">{{LONGEST}}<tspan font-size="12" fill="#8a877f"> d</tspan></text><text x="1012" y="236">{{PEAK}}</text>
  </g>
  <g class="m" font-size="9.5" letter-spacing="1.2" fill="#6f6c65">
    <text x="622" y="252">CONTRIBUTIONS</text><text x="756" y="252">ACTIVE DAYS</text><text x="890" y="252">LONGEST RUN</text><text x="1012" y="252">PEAK  ·  {{PEAKDATE}}</text>
  </g>
</g>
</svg>
