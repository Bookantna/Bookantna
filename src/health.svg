<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
<title id="t">Training montage</title>
<desc id="d">Current quest: building phishMe and Screenie. Ask me about data leakage and text-to-SQL agents. A halftone map of the last 52 weeks of contributions: {{TOTAL}} contributions over {{ACTIVE}} active days, longest run {{LONGEST}} days, peak {{PEAK}} on {{PEAKDATE}}.</desc>
<style>
/*FONTS*/
.b{font-family:'Bangers',Impact,sans-serif}
.c{font-family:'Comic Neue','Comic Sans MS',cursive;font-weight:700}
.m{font-family:'Geist Mono',ui-monospace,monospace}
.col{animation:col .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes col{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.p{transform-box:fill-box;transform-origin:center;animation:p .55s cubic-bezier(.34,1.56,.64,1) both}
@keyframes p{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.head{animation:sweep 9s cubic-bezier(.65,0,.35,1) 2s infinite alternate both}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(792px)}}
.grind{transform-origin:770px 46px;animation:grind .9s ease-in-out infinite alternate}
@keyframes grind{from{transform:rotate(-6deg)}to{transform:rotate(4deg) scale(1.06)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.head{display:none}}
</style>
<rect width="1200" height="330" rx="6" fill="#fffaf0"/>
<rect x="3" y="3" width="1194" height="324" rx="6" fill="none" stroke="#1d1a16" stroke-width="6"/>

<!-- left: current quest -->
<path d="M3 3H330V327H3Z" fill="#1d1a16"/>
<text class="b" x="30" y="58" font-size="34" letter-spacing="1.5" fill="#f7c548">CURRENT QUEST</text>
<g class="c" fill="#fffaf0">
  <text x="30" y="96" font-size="13" class="m" font-weight="600" letter-spacing="1.5" fill="#f7c548" opacity=".8">NOW BUILDING</text>
  <text x="30" y="120" font-size="19">phishMe, Screenie</text>
  <text x="30" y="160" font-size="13" class="m" font-weight="600" letter-spacing="1.5" fill="#f7c548" opacity=".8">ASK ME ABOUT</text>
  <text x="30" y="184" font-size="19">Data leakage,</text>
  <text x="30" y="208" font-size="19">text-to-SQL agents</text>
</g>
<!-- the sidekick's report card -->
<rect x="30" y="236" width="272" height="64" fill="#f7c548" stroke="#fffaf0" stroke-width="3"/>
<g class="c" fill="#1d1a16" font-size="14.5">
  <text x="44" y="262">Reported bugs: <tspan fill="#e4432d">fixed.</tspan></text>
  <text x="44" y="284">Overall health: <tspan class="b" font-size="18" letter-spacing="1" fill="#e4432d">PASSED!</tspan></text>
</g>

<!-- right: montage -->
<text class="b" x="364" y="62" font-size="44" letter-spacing="1.5" fill="#1d1a16">TRAINING MONTAGE</text>
<g class="grind">
  <rect x="710" y="24" width="120" height="44" fill="#e4432d" stroke="#1d1a16" stroke-width="4"/>
  <text class="b" x="770" y="56" text-anchor="middle" font-size="30" letter-spacing="1.5" fill="#f7c548" stroke="#1d1a16" stroke-width="4" paint-order="stroke">GRIND!</text>
</g>
<g class="m" font-size="10" font-weight="600" letter-spacing="1.5" fill="#1d1a16" opacity=".6">
  <text x="366" y="90">52 WEEKS  /  ONE DOT PER DAY  /  AS OF {{UPDATED}}</text>
  {{LEGEND 1166 90}}
</g>
{{HEATMAP 364 104 15 12}}
<rect class="head" x="362" y="100" width="3" height="110" fill="#e4432d" opacity=".75"/>
<g class="m" font-size="10" font-weight="600" letter-spacing="1.3" fill="#1d1a16" opacity=".55">
  {{MONTHS 364 226 15}}
</g>

<g class="b" text-anchor="middle" letter-spacing="1">
  <g class="p" style="animation-delay:.9s">
    <rect x="364" y="246" width="186" height="60" fill="#f7c548" stroke="#1d1a16" stroke-width="4"/>
    <text x="414" y="288" font-size="38" fill="#1d1a16">{{TOTAL}}</text>
    <text x="494" y="274" font-size="15" fill="#1d1a16">CONTRI-</text><text x="494" y="292" font-size="15" fill="#1d1a16">BUTIONS</text>
  </g>
  <g class="p" style="animation-delay:1s">
    <rect x="566" y="246" width="186" height="60" fill="#fffaf0" stroke="#1d1a16" stroke-width="4"/>
    <text x="616" y="288" font-size="38" fill="#e4432d">{{ACTIVE}}</text>
    <text x="696" y="274" font-size="15" fill="#1d1a16">ACTIVE</text><text x="696" y="292" font-size="15" fill="#1d1a16">DAYS</text>
  </g>
  <g class="p" style="animation-delay:1.1s">
    <rect x="768" y="246" width="186" height="60" fill="#fffaf0" stroke="#1d1a16" stroke-width="4"/>
    <text x="818" y="288" font-size="38" fill="#e4432d">{{LONGEST}}</text>
    <text x="898" y="274" font-size="15" fill="#1d1a16">DAY</text><text x="898" y="292" font-size="15" fill="#1d1a16">STREAK</text>
  </g>
  <g class="p" style="animation-delay:1.2s">
    <rect x="970" y="246" width="196" height="60" fill="#1d1a16" stroke="#1d1a16" stroke-width="4"/>
    <text x="1020" y="288" font-size="38" fill="#f7c548">{{PEAK}}</text>
    <text x="1106" y="274" font-size="15" fill="#fffaf0">BEST DAY</text><text x="1106" y="292" font-size="15" fill="#fffaf0">{{PEAKDATE}}</text>
  </g>
</g>
</svg>
