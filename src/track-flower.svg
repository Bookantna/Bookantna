<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Flower Image Colorization</title>
<desc id="d">Flower Image Colorization: a conditional GAN with a U-Net generator and a PatchGAN discriminator that colorizes grayscale flower images. Trained on 5,000 images for 10 epochs.</desc>
<style>
/*FONTS*/
.s{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}
.m{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.rise{animation:rise 1s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wipe{animation:wipe 7s cubic-bezier(.65,0,.35,1) infinite both}
@keyframes wipe{0%,8%{transform:translateX(-140px)}48%,78%{transform:none}100%{transform:translateX(-140px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <radialGradient id="petal" cx="384" cy="148" r="70" gradientUnits="userSpaceOnUse">
    <stop offset=".2" stop-color="#f1cf94"/><stop offset=".75" stop-color="#e2a03f"/><stop offset="1" stop-color="#b8692a"/>
  </radialGradient>
  <g id="flower">
    <g id="outer">
      <ellipse cx="384" cy="113" rx="16" ry="33"/>
      <ellipse cx="384" cy="113" rx="16" ry="33" transform="rotate(45 384 148)"/>
      <ellipse cx="384" cy="113" rx="16" ry="33" transform="rotate(90 384 148)"/>
      <ellipse cx="384" cy="113" rx="16" ry="33" transform="rotate(135 384 148)"/>
      <ellipse cx="384" cy="113" rx="16" ry="33" transform="rotate(180 384 148)"/>
      <ellipse cx="384" cy="113" rx="16" ry="33" transform="rotate(225 384 148)"/>
      <ellipse cx="384" cy="113" rx="16" ry="33" transform="rotate(270 384 148)"/>
      <ellipse cx="384" cy="113" rx="16" ry="33" transform="rotate(315 384 148)"/>
    </g>
  </g>
  <clipPath id="reveal"><rect class="wipe" x="314" y="70" width="140" height="160"/></clipPath>
</defs>
<rect width="480" height="300" rx="20" fill="#121211"/>
<rect x=".5" y=".5" width="479" height="299" rx="19.5" fill="none" stroke="#2a2926"/>

<text class="m" x="40" y="54" font-size="11" letter-spacing="1.4" fill="#e2a03f">TRK 03<tspan fill="#6f6c65">  /  PYTORCH  ·  CGAN</tspan></text>
<g class="s rise" font-size="30" font-weight="620" letter-spacing="-1.2" fill="#e9e6df">
  <text x="38" y="100">Flower</text><text x="38" y="134">Colorization</text>
</g>
<g class="s rise" style="animation-delay:.1s" font-size="15" fill="#bdb9b0">
  <text x="40" y="170">Conditional GAN that colorizes</text>
  <text x="40" y="192">grayscale flowers. U-Net generator,</text>
  <text x="40" y="214">PatchGAN discriminator.</text>
</g>
<g class="rise" style="animation-delay:.25s">
  <g class="m" font-size="22" fill="#e9e6df"><text x="40" y="254">5,000</text><text x="150" y="254">10</text></g>
  <g class="m" font-size="9.5" letter-spacing="1.2" fill="#6f6c65"><text x="40" y="274">IMAGES</text><text x="150" y="274">EPOCHS</text></g>
</g>

<!-- grayscale input -->
<g stroke="#121211" stroke-width="1.5">
  <use href="#flower" fill="#3b3a36"/>
  <g transform="rotate(22.5 384 148) scale(.66) translate(197.8 76.2)" fill="#55524b"><use href="#outer"/></g>
</g>
<circle cx="384" cy="148" r="12" fill="#2a2926" stroke="#121211" stroke-width="1.5"/>
<!-- colorized output, revealed by the sweep -->
<g clip-path="url(#reveal)">
  <g stroke="#121211" stroke-width="1.5">
    <use href="#flower" fill="url(#petal)"/>
    <g transform="rotate(22.5 384 148) scale(.66) translate(197.8 76.2)" fill="#d38a3a"><use href="#outer"/></g>
  </g>
  <circle cx="384" cy="148" r="12" fill="#5a3a18" stroke="#121211" stroke-width="1.5"/>
</g>
<rect class="wipe" x="453" y="72" width="1.5" height="156" fill="#ece7dc"/>
<g class="m" font-size="9.5" letter-spacing="1.2" fill="#6f6c65">
  <text x="320" y="252">GRAY</text><text x="448" y="252" text-anchor="end">RGB</text>
</g>
<path d="M356 248.5H412" stroke="#3b3a36"/><path d="M408 245.5L412 248.5L408 251.5" fill="none" stroke="#3b3a36"/>
</svg>
