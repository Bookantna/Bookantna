<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
<title id="t">Episode 03: Flower Image Colorization</title>
<desc id="d">Flower Image Colorization, in: the grayscale curse. A conditional GAN with a U-Net generator and a PatchGAN discriminator that colorizes grayscale flower images. Trained on 5,000 images for 10 epochs. Art: a gray flower blooms into color.</desc>
<style>
/*FONTS*/
.b{font-family:'Bangers',Impact,sans-serif}
.c{font-family:'Comic Neue','Comic Sans MS',cursive;font-weight:700}
.r{font-weight:400}
.m{font-family:'Geist Mono',ui-monospace,monospace}
.in{animation:in .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pet{animation:pet 5s ease-in-out infinite}
@keyframes pet{0%,25%{fill:#b9b1a0}45%,85%{fill:#e4432d}100%{fill:#b9b1a0}}
.mid{animation:mid 5s ease-in-out infinite}
@keyframes mid{0%,25%{fill:#8d877b}45%,85%{fill:#f7c548}100%{fill:#8d877b}}
.leaf{animation:leaf 5s ease-in-out infinite}
@keyframes leaf{0%,25%{fill:#a39b8a}45%,85%{fill:#f7c548}100%{fill:#a39b8a}}
.sway{transform-origin:372px 290px;animation:sway 3s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(3deg)}}
.bloom{transform-origin:400px 70px;animation:bloom 5s cubic-bezier(.34,1.56,.64,1) infinite both}
@keyframes bloom{0%,30%{opacity:0;transform:scale(.3) rotate(-8deg)}42%,84%{opacity:1;transform:rotate(6deg)}92%,100%{opacity:0;transform:rotate(6deg)}}
.g{animation:g 5s steps(1) infinite}.k{animation:k 5s steps(1) infinite}
@keyframes g{0%,34%{opacity:1}35%,92%{opacity:0}93%{opacity:1}}
@keyframes k{0%,34%{opacity:0}35%,92%{opacity:1}93%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.g{opacity:0}}
</style>
<defs>
  <pattern id="htk" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="3.5" cy="3.5" r="1.4" fill="#1d1a16"/></pattern>
  <clipPath id="art"><rect x="288" y="26" width="166" height="268"/></clipPath>
</defs>
<rect width="480" height="320" rx="6" fill="#fffaf0"/>
<rect x="3" y="3" width="474" height="314" rx="6" fill="none" stroke="#1d1a16" stroke-width="6"/>

<rect x="24" y="26" width="138" height="30" fill="#1d1a16"/>
<text class="m" x="38" y="46" font-size="12" font-weight="700" letter-spacing="2" fill="#f7c548">EPISODE 03</text>
<g class="in">
  <text class="b" x="22" y="104" font-size="42" letter-spacing="1.5" fill="#f7c548" stroke="#1d1a16" stroke-width="5.5" stroke-linejoin="round" paint-order="stroke">FLOWER</text>
  <text class="b" x="22" y="146" font-size="34" letter-spacing="1.5" fill="#f7c548" stroke="#1d1a16" stroke-width="5" stroke-linejoin="round" paint-order="stroke">COLORIZATION</text>
  <text class="c" x="24" y="172" font-size="14.5" fill="#e4432d">IN: THE GRAYSCALE CURSE</text>
</g>
<g class="c r in" style="animation-delay:.12s" font-size="14" fill="#1d1a16">
  <text x="24" y="200">Conditional GAN. U-Net</text>
  <text x="24" y="220">generator, PatchGAN critic.</text>
</g>
<g class="in" style="animation-delay:.3s">
  <rect x="24" y="242" width="120" height="52" fill="#f7c548" stroke="#1d1a16" stroke-width="3.5"/>
  <rect x="152" y="242" width="112" height="52" fill="#fffaf0" stroke="#1d1a16" stroke-width="3.5"/>
  <g class="b" font-size="28"><text x="36" y="278" fill="#1d1a16">5,000</text><text x="164" y="278" fill="#e4432d">10</text></g>
  <g class="m" font-size="8.5" font-weight="700" letter-spacing="1" text-anchor="end" fill="#1d1a16"><text x="138" y="290">IMAGES</text><text x="258" y="272">EPOCHS</text></g>
</g>

<g clip-path="url(#art)">
  <rect x="288" y="26" width="166" height="268" fill="#f4ecd6"/>
  <rect x="288" y="26" width="166" height="268" fill="url(#htk)" opacity=".18"/>
  <g class="sway" stroke="#1d1a16" stroke-width="4" stroke-linejoin="round">
    <path d="M372 294C372 250 366 210 372 168" fill="none" stroke-width="5"/>
    <path class="leaf" d="M370 250C340 248 320 228 318 212C344 210 364 226 370 250Z"/>
    <path class="leaf" d="M374 226C400 226 418 208 420 192C396 192 378 206 374 226Z"/>
    <g class="pet">
      <ellipse cx="372" cy="110" rx="18" ry="30"/>
      <ellipse cx="372" cy="110" rx="18" ry="30" transform="rotate(60 372 140)"/>
      <ellipse cx="372" cy="110" rx="18" ry="30" transform="rotate(120 372 140)"/>
      <ellipse cx="372" cy="110" rx="18" ry="30" transform="rotate(180 372 140)"/>
      <ellipse cx="372" cy="110" rx="18" ry="30" transform="rotate(240 372 140)"/>
      <ellipse cx="372" cy="110" rx="18" ry="30" transform="rotate(300 372 140)"/>
    </g>
    <circle class="mid" cx="372" cy="140" r="18"/>
  </g>
  <rect x="288" y="256" width="166" height="38" fill="#1d1a16"/>
  <g class="m" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">
    <text class="g" x="371" y="280" fill="#fffaf0">INPUT: GRAY</text>
    <text class="k" x="371" y="280" fill="#f7c548">OUTPUT: RGB</text>
  </g>
</g>
<g class="bloom">
  <path d="{{BURST 400 68 34 52 10 51}}" fill="#f7c548" stroke="#1d1a16" stroke-width="4" stroke-linejoin="round"/>
  <text class="b" x="400" y="79" text-anchor="middle" font-size="22" letter-spacing="1" fill="#e4432d">BLOOM!</text>
</g>
<rect x="288" y="26" width="166" height="268" fill="none" stroke="#1d1a16" stroke-width="5"/>
</svg>
