    <text x="190" y="348" fill="#e4432d">10,000</text>
    <text x="338" y="348" fill="#e4432d">≤25MB</text>
    <text x="486" y="348" fill="#f7c548">≤250MS</text>
  </g>
  <g class="m" font-size="8.5" font-weight="700" letter-spacing="1" fill="#1d1a16">
    <text x="164" y="331" text-anchor="end">ROWS</text>
    <text x="312" y="331" text-anchor="end">DRAWS</text>
    <text x="460" y="331" text-anchor="end">MODEL</text>
    <text x="616" y="331" text-anchor="end" fill="#fffaf0">P95</text>
  </g>
</g>

<!-- art -->
<g clip-path="url(#art)">
  <rect x="668" y="26" width="504" height="338" fill="#f4ecd6"/>
  <path d="{{RAYS 920 150 40 520 40 23}}" fill="#1d1a16" opacity=".08"/>
  <g class="waves">
    <path d="M660 300q15-10 30 0t30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0V370H660Z" fill="url(#hty)" stroke="#1d1a16" stroke-width="3.5"/>
  </g>
  <g class="fish">
    <path d="M700 262L676 244V282Z" fill="#e4432d" stroke="#1d1a16" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="746" cy="262" rx="50" ry="30" fill="#e4432d" stroke="#1d1a16" stroke-width="4.5"/>
    <path d="M730 238Q746 228 762 238" fill="none" stroke="#1d1a16" stroke-width="3.5" stroke-linecap="round"/>
