<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
<title id="t">phishMe</title>
<desc id="d">phishMe: a leakage-aware phishing detection pipeline. 46,786 de-duplicated rows split 28,068 / 9,356 / 9,362, disjoint by registrable domain. Paired bootstrap with 10,000 resamples. The linear model runs on-device in a Chrome extension under a 25 MB and 250 ms p95 budget.</desc>
<style>
/*FONTS*/
.s{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}
.m{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.rise{animation:rise 1s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.seg{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.2s cubic-bezier(.16,1,.3,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.feed{animation:feed 21s linear infinite}
@keyframes feed{to{transform:translateY(-210px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <clipPath id="win"><rect x="680" y="128" width="472" height="164" rx="10"/></clipPath>
  <linearGradient id="vfade" x1="0" y1="128" x2="0" y2="292" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".22" stop-color="#fff"/>
    <stop offset=".78" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="vmask"><rect x="680" y="128" width="472" height="164" fill="url(#vfade)"/></mask>
</defs>
<rect width="1200" height="340" rx="22" fill="#121211"/>
<rect x=".5" y=".5" width="1199" height="339" rx="21.5" fill="none" stroke="#2a2926"/>

<!-- left: copy -->
<g class="m" font-size="11" letter-spacing="1.4">
  <text x="48" y="58" fill="#e2a03f">TRK 01<tspan fill="#6f6c65">  /  FEATURED  ·  PYTHON  ·  LIGHTGBM  ·  CHROME MV3</tspan></text>
</g>
<text class="s rise" x="46" y="112" font-size="40" font-weight="620" letter-spacing="-1.6" fill="#e9e6df">phishMe</text>
<g class="m rise" style="animation-delay:.1s">
  <rect x="216" y="88" width="148" height="24" rx="12" fill="none" stroke="#3b3a36"/>
  <text x="290" y="104" text-anchor="middle" font-size="10" letter-spacing="1.3" fill="#8a877f">RESEARCH PROTOTYPE</text>
</g>
<g class="s rise" style="animation-delay:.15s" font-size="16.5" fill="#bdb9b0">
  <text x="48" y="152">Does a model that looks near-perfect on its own benchmark</text>
  <text x="48" y="177">still work on data it has never seen? A leakage-aware</text>
  <text x="48" y="202">phishing pipeline, with a linear model that scores on-device.</text>
</g>
<path d="M48 232H624" stroke="#232321"/>
<g class="rise" style="animation-delay:.3s">
  <g class="m" font-size="22" fill="#e9e6df" letter-spacing="-.4">
    <text x="48" y="272">46,786</text><text x="196" y="272">10,000</text><text x="344" y="272">≤25<tspan font-size="13" fill="#8a877f"> MB</tspan></text><text x="474" y="272">≤250<tspan font-size="13" fill="#8a877f"> ms</tspan></text>
  </g>
  <g class="m" font-size="10" letter-spacing="1.2" fill="#6f6c65">
    <text x="48" y="294">ROWS, DEDUPED</text><text x="196" y="294">BOOTSTRAP DRAWS</text><text x="344" y="294">MODEL PAYLOAD</text><text x="474" y="294">P95 SCORING</text>
  </g>
</g>

<!-- right: split bar -->
<text class="m" x="680" y="58" font-size="10" letter-spacing="1.3" fill="#6f6c65">SPLIT  ·  DISJOINT BY REGISTRABLE DOMAIN</text>
<g>
  <rect class="seg" style="animation-delay:.3s" x="680" y="72" width="278.4" height="10" rx="2" fill="#e2a03f"/>
  <rect class="seg" style="animation-delay:.45s" x="962.4" y="72" width="92.8" height="10" rx="2" fill="#6f6c65"/>
  <rect class="seg" style="animation-delay:.6s" x="1059.2" y="72" width="92.8" height="10" rx="2" fill="#3b3a36"/>
</g>
<g class="m rise" style="animation-delay:.7s" font-size="11" fill="#8a877f">
  <text x="680" y="102">train <tspan fill="#e9e6df">28,068</tspan></text>
  <text x="962.4" y="102">val <tspan fill="#e9e6df">9,356</tspan></text>
  <text x="1059.2" y="102">test <tspan fill="#e9e6df">9,362</tspan></text>
</g>

<!-- right: live scoring feed -->
<rect x="680" y="128" width="472" height="164" rx="10" fill="#0c0c0b"/>
<g clip-path="url(#win)" mask="url(#vmask)">
  <g class="feed m" font-size="12">
    <g id="rows">
      <text x="700" y="160" fill="#c9c5bc">verify-wallet.top/claim</text><text x="1068" y="160" text-anchor="end" fill="#e9e6df">0.94</text><text x="1132" y="160" text-anchor="end" fill="#e2a03f" font-size="10" letter-spacing="1.2">PHISH</text>
      <text x="700" y="190" fill="#c9c5bc">docs.python.org/3/library</text><text x="1068" y="190" text-anchor="end" fill="#e9e6df">0.02</text><text x="1132" y="190" text-anchor="end" fill="#6f6c65" font-size="10" letter-spacing="1.2">OK</text>
      <text x="700" y="220" fill="#c9c5bc">secure-l0gin.app/session</text><text x="1068" y="220" text-anchor="end" fill="#e9e6df">0.88</text><text x="1132" y="220" text-anchor="end" fill="#e2a03f" font-size="10" letter-spacing="1.2">PHISH</text>
      <text x="700" y="250" fill="#c9c5bc">github.com/Bookantna</text><text x="1068" y="250" text-anchor="end" fill="#e9e6df">0.01</text><text x="1132" y="250" text-anchor="end" fill="#6f6c65" font-size="10" letter-spacing="1.2">OK</text>
      <text x="700" y="280" fill="#c9c5bc">bit.ly/3xQ7aKe</text><text x="1068" y="280" text-anchor="end" fill="#e9e6df">0.57</text><text x="1132" y="280" text-anchor="end" fill="#bdb9b0" font-size="10" letter-spacing="1.2">REVIEW</text>
      <text x="700" y="310" fill="#c9c5bc">parcel-redelivery.cc/th/track</text><text x="1068" y="310" text-anchor="end" fill="#e9e6df">0.91</text><text x="1132" y="310" text-anchor="end" fill="#e2a03f" font-size="10" letter-spacing="1.2">PHISH</text>
      <text x="700" y="340" fill="#c9c5bc">kku.ac.th/en</text><text x="1068" y="340" text-anchor="end" fill="#e9e6df">0.04</text><text x="1132" y="340" text-anchor="end" fill="#6f6c65" font-size="10" letter-spacing="1.2">OK</text>
    </g>
    <use href="#rows" y="210"/>
  </g>
</g>
<rect x="680.5" y="128.5" width="471" height="163" rx="9.5" fill="none" stroke="#2a2926"/>
<text class="m" x="680" y="316" font-size="10" letter-spacing="1.3" fill="#5a5852">ILLUSTRATIVE FEED  ·  CROSS-DATASET RESULTS DO NOT YET GENERALIZE</text>
</svg>
