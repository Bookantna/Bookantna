  <text class="c" x="747" y="210" text-anchor="middle" font-size="13" fill="#1d1a16">totally legit</text>
  <text class="c" x="747" y="227" text-anchor="middle" font-size="13" fill="#1d1a16">link, trust me</text>

  <g class="sway">
    <path d="M920 26V150" stroke="#1d1a16" stroke-width="2.5"/>
    <path d="M920 148V166Q920 178 908 176Q900 174 902 164" fill="none" stroke="#1d1a16" stroke-width="4" stroke-linecap="round"/>
    <g transform="rotate(3 920 230)">
