<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d">
<title id="t">Episode 01: phishMe</title>
<desc id="d">phishMe, the case of the too-perfect benchmark. A leakage-aware phishing detection pipeline: 46,786 de-duplicated rows split 28,068 / 9,356 / 9,362, disjoint by registrable domain, paired bootstrap with 10,000 resamples, and a linear model that runs on-device in a Chrome extension under 25 MB and 250 ms p95. Art: a fishing hook dangles a fake login card and a red stamp slams down: phish, 0.94.</desc>
<style>
/*FONTS*/
.b{font-family:'Bangers',Impact,sans-serif}
.c{font-family:'Comic Neue','Comic Sans MS',cursive;font-weight:700}
.r{font-weight:400}
.m{font-family:'Geist Mono',ui-monospace,monospace}
.in{animation:in .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.seg{transform-box:fill-box;transform-origin:0 50%;animation:grow 1s cubic-bezier(.16,1,.3,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.sway{transform-origin:920px 26px;animation:sway 3.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.stamp{transform-origin:990px 262px;animation:stamp 4.2s cubic-bezier(.34,1.56,.64,1) infinite both}
@keyframes stamp{0%,30%{opacity:0;transform:rotate(-14deg) scale(2.2)}40%,92%{opacity:1;transform:rotate(-14deg) scale(1)}100%{opacity:0;transform:rotate(-14deg) scale(1)}}
.fish{animation:fish 2.2s ease-in-out infinite}
@keyframes fish{50%{transform:translate(6px,-5px)}}
.waves{animation:waves 5s linear infinite}
@keyframes waves{to{transform:translateX(-60px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <pattern id="htr" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="4" cy="4" r="2.2" fill="#e4432d"/></pattern>
  <pattern id="hty" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="4.5" cy="4.5" r="2.5" fill="#f7c548"/></pattern>
  <clipPath id="art"><rect x="668" y="26" width="504" height="338"/></clipPath>
</defs>
<rect width="1200" height="390" rx="6" fill="#fffaf0"/>
<rect x="3" y="3" width="1194" height="384" rx="6" fill="none" stroke="#1d1a16" stroke-width="6"/>

<!-- copy -->
<rect x="30" y="26" width="138" height="32" fill="#1d1a16"/>
<text class="m" x="44" y="47" font-size="12" font-weight="700" letter-spacing="2" fill="#f7c548">EPISODE 01</text>
<text class="m" x="184" y="47" font-size="11" font-weight="600" letter-spacing="1.6" fill="#1d1a16" opacity=".6">PYTHON / LIGHTGBM / CHROME MV3</text>
<g class="in">
  <text class="b" x="28" y="128" font-size="78" letter-spacing="2" fill="#f7c548" stroke="#1d1a16" stroke-width="7" stroke-linejoin="round" paint-order="stroke">PHISHME</text>
  <text class="c" x="30" y="160" font-size="18" fill="#e4432d">IN: THE CASE OF THE TOO-PERFECT BENCHMARK</text>
</g>
<g class="c r in" style="animation-delay:.12s" font-size="16.5" fill="#1d1a16">
  <text x="30" y="196">A phishing model aced its own benchmark. Our hero asked:</text>
  <text x="30" y="220">does it still work on data it has never seen? A leakage-aware</text>
  <text x="30" y="244">pipeline, plus a linear model that scores on-device in Chrome.</text>
</g>

<!-- split -->
<g stroke="#1d1a16" stroke-width="3.5">
  <rect class="seg" style="animation-delay:.3s" x="30" y="264" width="356" height="20" fill="#e4432d"/>
  <rect class="seg" style="animation-delay:.45s" x="386" y="264" width="118" height="20" fill="#f7c548"/>
  <rect class="seg" style="animation-delay:.6s" x="504" y="264" width="118" height="20" fill="#fffaf0"/>
</g>
<g class="m" font-size="11" font-weight="600" fill="#1d1a16">
  <text x="30" y="302">TRAIN 28,068</text><text x="392" y="302">VAL 9,356</text><text x="510" y="302">TEST 9,362</text>
  <text x="372" y="302" text-anchor="end" opacity=".55">DISJOINT BY DOMAIN</text>
</g>

<!-- stats -->
<g class="in" style="animation-delay:.5s">
  <g stroke="#1d1a16" stroke-width="3.5">
    <rect x="30" y="316" width="140" height="48" fill="#f7c548"/>
    <rect x="178" y="316" width="140" height="48" fill="#fffaf0"/>
    <rect x="326" y="316" width="140" height="48" fill="#fffaf0"/>
    <rect x="474" y="316" width="148" height="48" fill="#1d1a16"/>
  </g>
  <g class="b" font-size="27" letter-spacing="1">
